<svg xmlns="http://www.w3.org/2000/svg" width="640" height="336" viewBox="0 0 640 336" role="img" aria-labelledby="title description">
  <title id="title">Same service code. Three deployments.</title>
  <desc id="description">A provider and consumer run in one thread, two threads of one process, or separate processes connected through mtrouter over TCP. Solid boundaries are processes; dashed boundaries are threads. Change the deployment model and build layout, not the service implementations.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8Z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 24px; fill: #1f2328; }
      .label { font-size: 22px; fill: #57606a; }
      .heading { font-weight: 600; }
      .process { fill: #f6f8fa; stroke: #8c959f; stroke-width: 2; }
      .thread { fill: none; stroke: #57606a; stroke-width: 2; stroke-dasharray: 5 4; }
      .provider { fill: #dafbe1; stroke: #22863a; stroke-width: 2; }
      .consumer { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
      .link { fill: none; stroke: #57606a; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="1" y="1" width="638" height="334" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text class="heading" x="22" y="40">One thread</text>
  <text class="label" x="22" y="69">One process</text>
  <rect class="process" x="210" y="16" width="408" height="76" rx="8"/>
  <rect class="thread" x="218" y="24" width="392" height="60" rx="6"/>
  <rect class="provider" x="230" y="33" width="145" height="42" rx="6"/>
  <text x="302" y="61" text-anchor="middle">Provider</text>
  <path class="link" d="M380 54 H444"/>
  <rect class="consumer" x="450" y="33" width="148" height="42" rx="6"/>
  <text x="524" y="61" text-anchor="middle">Consumer</text>

  <text class="heading" x="22" y="140">Two threads</text>
  <text class="label" x="22" y="169">One process</text>
  <rect class="process" x="210" y="116" width="408" height="76" rx="8"/>
  <rect class="thread" x="218" y="124" width="168" height="60" rx="6"/>
  <rect class="thread" x="440" y="124" width="170" height="60" rx="6"/>
  <rect class="provider" x="230" y="133" width="145" height="42" rx="6"/>
  <text x="302" y="161" text-anchor="middle">Provider</text>
  <path class="link" d="M390 154 H436"/>
  <rect class="consumer" x="450" y="133" width="148" height="42" rx="6"/>
  <text x="524" y="161" text-anchor="middle">Consumer</text>

  <text class="heading" x="22" y="226">Separate processes or machines</text>
  <rect class="process" x="22" y="242" width="180" height="72" rx="8"/>
  <rect class="provider" x="34" y="257" width="156" height="42" rx="6"/>
  <text x="112" y="285" text-anchor="middle">Provider</text>
  <path class="link" d="M207 278 H243"/>
  <rect x="250" y="245" width="140" height="66" rx="8" fill="#1f2328"/>
  <text x="320" y="272" text-anchor="middle" style="fill:#ffffff">mtrouter</text>
  <text class="label" x="320" y="298" text-anchor="middle" style="fill:#ffffff">TCP</text>
  <path class="link" d="M396 278 H432"/>
  <rect class="process" x="438" y="242" width="180" height="72" rx="8"/>
  <rect class="consumer" x="450" y="257" width="156" height="42" rx="6"/>
  <text x="528" y="285" text-anchor="middle">Consumer</text>
</svg>
