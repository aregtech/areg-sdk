<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256" role="img" aria-labelledby="title description">
  <title id="title">Same service code. Three deployments.</title>
  <desc id="description">The same provider and consumer share one thread, use two threads in one process, or run in separate processes on one or more machines. Solid outlines mark application processes; dashed outlines mark threads. Cross-process messages pass through mtrouter over TCP.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#71859a" stroke-width="1.4"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24394b; font-size: 21px; }
      .heading { font-size: 20px; font-weight: 600; }
      .muted { fill: #5d7083; font-size: 16px; }
      .canvas { fill: #ffffff; }
      .process { fill: #f7fafc; stroke: #bdcdd9; stroke-width: 1; }
      .thread { fill: none; stroke: #8ca1b3; stroke-width: 1; stroke-dasharray: 4 4; }
      .provider { fill: #e6f4f0; }
      .consumer { fill: #efedfa; }
      .router { fill: #174e65; }
      .router-label { fill: #ffffff; font-size: 21px; }
      .router-note { fill: #ffffff; font-size: 16px; }
      .link { fill: none; stroke: #71859a; stroke-width: 1.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      @media (max-width: 420px) {
        text { font-size: 24px; }
        .heading { font-size: 22px; }
        .muted { font-size: 18px; }
        .router-note { font-size: 18px; }
      }
      @media (prefers-color-scheme: dark) {
        text { fill: #e1eaf2; }
        .canvas { fill: #101923; }
        .muted { fill: #a4b8ca; }
        .process { fill: #172330; stroke: #456075; }
        .thread { stroke: #7892a7; }
        .provider { fill: #1b403e; }
        .consumer { fill: #35304e; }
        .router { fill: #215e77; }
      }
    </style>
  </defs>
  <rect class="canvas" width="640" height="256" rx="12"/>
  <text class="heading" x="22" y="40">One thread</text>
  <text class="muted" x="22" y="63">one process</text>
  <rect class="process" x="208" y="14" width="410" height="64" rx="8"/>
  <rect class="thread" x="218" y="23" width="390" height="46" rx="6"/>
  <rect class="provider" x="228" y="30" width="140" height="32" rx="5"/>
  <text x="298" y="53" text-anchor="middle">Provider</text>
  <path class="link" d="M378 46 H448"/>
  <rect class="consumer" x="458" y="30" width="140" height="32" rx="5"/>
  <text x="528" y="53" text-anchor="middle">Consumer</text>

  <text class="heading" x="22" y="116">Two threads</text>
  <text class="muted" x="22" y="139">one process</text>
  <rect class="process" x="208" y="90" width="410" height="64" rx="8"/>
  <rect class="thread" x="218" y="99" width="160" height="46" rx="6"/>
  <rect class="thread" x="448" y="99" width="160" height="46" rx="6"/>
  <rect class="provider" x="228" y="106" width="140" height="32" rx="5"/>
  <text x="298" y="129" text-anchor="middle">Provider</text>
  <path class="link" d="M386 122 H440"/>
  <rect class="consumer" x="458" y="106" width="140" height="32" rx="5"/>
  <text x="528" y="129" text-anchor="middle">Consumer</text>

  <text class="heading" x="22" y="182">Separate processes or machines</text>
  <rect class="process" x="22" y="194" width="180" height="48" rx="8"/>
  <rect class="provider" x="30" y="202" width="164" height="32" rx="5"/>
  <text x="112" y="225" text-anchor="middle">Provider</text>
  <path class="link" d="M212 218 H238"/>
  <rect class="router" x="248" y="194" width="144" height="48" rx="8"/>
  <text class="router-label" x="320" y="214" text-anchor="middle">mtrouter</text>
  <text class="router-note" x="320" y="237" text-anchor="middle">TCP</text>
  <path class="link" d="M402 218 H428"/>
  <rect class="process" x="438" y="194" width="180" height="48" rx="8"/>
  <rect class="consumer" x="446" y="202" width="164" height="32" rx="5"/>
  <text x="528" y="225" text-anchor="middle">Consumer</text>
</svg>
