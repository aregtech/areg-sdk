<svg xmlns="http://www.w3.org/2000/svg" width="640" height="256" viewBox="0 0 640 256" role="img" aria-labelledby="title description">
  <title id="title">Build the client before the device exists</title>
  <desc id="description">Two alternative deployments retain the same consumer, service interface and provider role. During development the provider simulates the device. With hardware the provider is device-backed. Both illustrations use separate consumer and provider processes connected through mtrouter over TCP. Only one provider is selected for the role.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#71859a" stroke-width="1.4"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24394b; font-size: 21px; }
      .heading { font-size: 20px; font-weight: 600; }
      .muted { fill: #5d7083; font-size: 16px; }
      .canvas { fill: #ffffff; }
      .process { fill: #f7fafc; stroke: #bdcdd9; stroke-width: 1; }
      .provider { fill: #e6f4f0; }
      .consumer { fill: #efedfa; }
      .router { fill: #174e65; }
      .router-label { fill: #ffffff; font-size: 21px; }
      .router-note { fill: #ffffff; font-size: 16px; }
      .link { fill: none; stroke: #71859a; stroke-width: 1.2; marker-start: url(#arrow); marker-end: url(#arrow); }
      @media (max-width: 420px) {
        text { font-size: 24px; }
        .heading { font-size: 22px; }
        .muted { font-size: 18px; }
        .router-note { font-size: 18px; }
      }
      @media (prefers-color-scheme: dark) {
        text { fill: #e1eaf2; }
        .canvas { fill: #101923; }
        .muted { fill: #a4b8ca; }
        .process { fill: #172330; stroke: #456075; }
        .provider { fill: #1b403e; }
        .consumer { fill: #35304e; }
        .router { fill: #215e77; }
      }
    </style>
  </defs>
  <rect class="canvas" width="640" height="256" rx="12"/>
  <text class="heading" x="22" y="32">Use a simulated device</text>
  <rect class="process" x="22" y="48" width="180" height="48" rx="8"/>
  <rect class="consumer" x="30" y="56" width="164" height="32" rx="5"/>
  <text x="112" y="79" text-anchor="middle">Consumer</text>
  <path class="link" d="M212 72 H238"/>
  <rect class="router" x="248" y="48" width="144" height="48" rx="8"/>
  <text class="router-label" x="320" y="68" text-anchor="middle">mtrouter</text>
  <text class="router-note" x="320" y="91" text-anchor="middle">TCP</text>
  <path class="link" d="M402 72 H428"/>
  <rect class="process" x="438" y="48" width="180" height="48" rx="8"/>
  <rect class="provider" x="446" y="56" width="164" height="32" rx="5"/>
  <text x="528" y="79" text-anchor="middle">Simulator</text>

  <text class="heading" x="22" y="144">Connect to the real device</text>
  <rect class="process" x="22" y="160" width="180" height="48" rx="8"/>
  <rect class="consumer" x="30" y="168" width="164" height="32" rx="5"/>
  <text x="112" y="191" text-anchor="middle">Consumer</text>
  <path class="link" d="M212 184 H238"/>
  <rect class="router" x="248" y="160" width="144" height="48" rx="8"/>
  <text class="router-label" x="320" y="180" text-anchor="middle">mtrouter</text>
  <text class="router-note" x="320" y="203" text-anchor="middle">TCP</text>
  <path class="link" d="M402 184 H428"/>
  <rect class="process" x="438" y="160" width="180" height="48" rx="8"/>
  <rect class="provider" x="446" y="168" width="164" height="32" rx="5"/>
  <text x="528" y="191" text-anchor="middle">Device</text>
  <text class="muted" x="320" y="240" text-anchor="middle">Same interface and provider role</text>
</svg>
