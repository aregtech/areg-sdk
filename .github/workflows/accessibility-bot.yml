name: Accessibility-alt-text-bot
# Only the manual trigger is active while the CMake workflow is used to hunt a defect.
# Restore the 'issues', 'pull_request', 'issue_comment' and 'discussion' triggers when
# the hunt is over.
on:
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  discussions: write

jobs:
  accessibility_alt_text_bot:
    name: Check alt text is set on issue or pull requests
    runs-on: ubuntu-latest
    if: ${{ github.event.issue || github.event.pull_request || github.event.discussion }}
    steps:
      - name: Get action 'github/accessibility-alt-text-bot'
        uses: github/accessibility-alt-text-bot@v1.7.3 # Set to latest
