name: Diag 814

# TEMPORARY. Experiments for the PR 814 failures: bugs 415 and 416 (tsan RelWithDebInfo) and
# bug 150 (macOS try-send). While this file exists every other workflow skips this branch.
# Remove this file, .github/diag/ and the skip conditions of the other workflows together.
#
# linux : one leg per variant. Each builds the unit tests and the timer churn test, runs the
#         unit tests as the Sanitizers job does, repeats the StackTest suite and the churn test,
#         and keeps the disassembly of the functions in question and the binaries.
# macos : the build of the failing job (clang, Release, static, no extended, no logging); repeats
#         the failing test, and runs .github/diag/SocketWouldBlockDiag.cpp beside it.

on:
  push:
    branches: [ feature/812-general-ai-agent-doc-improvement ]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{matrix.v.name}}
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        v:
          # The Sanitizers tsan RelWithDebInfo job as it is: the control.
          - { name: gcc13-as-ci,         ref: '', gcc: '',   extra: '',             lto: 'ON',  san: 'tsan' }
          # Candidate: no identical code folding.
          - { name: gcc13-no-ipa-icf,    ref: '', gcc: '',   extra: '-fno-ipa-icf', lto: 'ON',  san: 'tsan' }
          # No link time optimization at all.
          - { name: gcc13-no-lto,        ref: '', gcc: '',   extra: '',             lto: 'OFF', san: 'tsan' }
          # The next compiler of the same image.
          - { name: gcc14-as-ci,         ref: '', gcc: '14', extra: '',             lto: 'ON',  san: 'tsan' }
          # master before the bug 414 fix, on today's image.
          - { name: master-gcc13,        ref: '9da7860a791a73a2618a74d7d960ddeb4d203344', gcc: '', extra: '', lto: 'ON', san: 'tsan' }
          # The shipped configuration: Release, LTO, no sanitizer.
          - { name: gcc13-release-plain, ref: '', gcc: '',   extra: '',             lto: 'ON',  san: 'none' }

    defaults:
      run:
        shell: bash
        working-directory: src

    env:
      DIAG: ${{github.workspace}}/diag/.github/diag
      OUT : ${{github.workspace}}/out

    steps:

      - name: Checkout the experiment files
        uses: actions/checkout@v7
        with:
          path: diag
          sparse-checkout: .github/diag

      - name: Checkout the sources under test
        uses: actions/checkout@v7
        with:
          ref: ${{matrix.v.ref || github.sha}}
          path: src

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Make room for the sanitizer shadow mapping
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true

      - name: Select the variant
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          if [ -n "${{matrix.v.gcc}}" ]; then
            mkdir -p "${HOME}/shim"
            ln -sf "/usr/bin/g++-${{matrix.v.gcc}}" "${HOME}/shim/g++"
            ln -sf "/usr/bin/gcc-${{matrix.v.gcc}}" "${HOME}/shim/gcc"
            echo "${HOME}/shim" >> "${GITHUB_PATH}"
            export PATH="${HOME}/shim:${PATH}"
          fi
          if [ -n "${{matrix.v.extra}}" ]; then
            sed -i 's|^TSAN_FLAGS="-fsanitize=thread |TSAN_FLAGS="-fsanitize=thread ${{matrix.v.extra}} |' tools/intern/sanitize.sh
            grep -n -- '^TSAN_FLAGS=.*${{matrix.v.extra}}' tools/intern/sanitize.sh
          fi
          if [ "${{matrix.v.lto}}" = "OFF" ]; then
            sed -i 's/set(CMAKE_INTERPROCEDURAL_OPTIMIZATION TRUE)/set(CMAKE_INTERPROCEDURAL_OPTIMIZATION FALSE)/' conf/cmake/gnu.cmake
            if grep -q 'set(CMAKE_INTERPROCEDURAL_OPTIMIZATION TRUE)' conf/cmake/gnu.cmake; then exit 1; fi
          fi
          {
            echo "variant  : ${{matrix.v.name}}"
            echo "sources  : $(git rev-parse HEAD)"
            echo "compiler : $(g++ --version | head -n 1)"
            echo "image    : ${ImageOS:-?} ${ImageVersion:-?}"
            echo "libtsan  : $(dpkg -S "$(readlink -f /lib/x86_64-linux-gnu/libtsan.so.2)" 2>/dev/null || echo '?')"
            echo "changes  :"
            git diff
          } | tee "${OUT}/provenance.txt"

      # The same command as the Sanitizers job: builds every test, runs ctest under TSan.
      - name: Run the unit tests as the Sanitizers job does
        id: ctest
        if: matrix.v.san == 'tsan'
        continue-on-error: true
        env:
          CMAKE_EXPORT_COMPILE_COMMANDS: 'ON'
        run: |
          tools/intern/sanitize.sh tsan --config RelWithDebInfo --target areg-unit-tests --run ctest 2>&1 | tee "${OUT}/ctest.log"
          exit "${PIPESTATUS[0]}"

      - name: Build without a sanitizer
        if: matrix.v.san == 'none'
        run: |
          cmake -B build-plain -S . -DAREG_COMPILER_FAMILY=gnu -DCMAKE_BUILD_TYPE=Release \
                -DAREG_LIB_TYPE=static -DAREG_TESTS=ON -DAREG_EXAMPLES=OFF \
                -DAREG_OUTPUT_DIR="${PWD}/build-plain/product" -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
                -DCMAKE_C_FLAGS="-g" -DCMAKE_CXX_FLAGS="-g"
          cmake --build build-plain -j"$(nproc)" --target areg-unit-tests areg-timer-churn-test

      - name: Locate the build
        if: always()
        run: |
          TREE="${PWD}/build-${{matrix.v.san == 'none' && 'plain' || 'tsan'}}"
          echo "TREE=${TREE}"                >> "${GITHUB_ENV}"
          echo "BIN=${TREE}/product/bin"     >> "${GITHUB_ENV}"
          {
            echo "compile commands with -flto       : $(grep -c -- '-flto' "${TREE}/compile_commands.json" || true)"
            echo "compile commands with -fno-ipa-icf: $(grep -c -- '-fno-ipa-icf' "${TREE}/compile_commands.json" || true)"
            echo "compile commands in total         : $(grep -c '"command"' "${TREE}/compile_commands.json" || true)"
          } | tee -a "${OUT}/provenance.txt"
          ls -la "${TREE}/product/bin" 2>&1 | tee -a "${OUT}/provenance.txt" || true

      - name: Repeat the StackTest suite
        id: stack
        if: always()
        continue-on-error: true
        run: |
          export TSAN_OPTIONS="second_deadlock_stack=1:history_size=7:halt_on_error=0:suppressions=${PWD}/tools/intern/sanitizer/tsan.supp"
          setarch "$(uname -m)" -R "${BIN}/areg-unit-tests.elf" --gtest_filter='StackTest.*' --gtest_repeat=3 2>&1 | tee "${OUT}/stacktest.log"
          exit "${PIPESTATUS[0]}"

      - name: Repeat the timer churn test
        id: churn
        if: always()
        continue-on-error: true
        run: |
          export TSAN_OPTIONS="second_deadlock_stack=1:history_size=7:halt_on_error=0:suppressions=${PWD}/tools/intern/sanitizer/tsan.supp"
          RUNS=40; reported=0; failed=0
          mkdir -p "${OUT}/churn"
          for i in $(seq 1 "${RUNS}"); do
            rc=0
            setarch "$(uname -m)" -R ctest --test-dir "${TREE}" -R '^areg-timer-churn-test$' --output-on-failure > "${OUT}/churn/run-${i}.log" 2>&1 || rc=$?
            n="$(grep -c 'WARNING: ThreadSanitizer' "${OUT}/churn/run-${i}.log" || true)"
            [ "${n}" != "0" ] && reported=$((reported + 1))
            [ "${rc}" != "0" ] && failed=$((failed + 1))
            [ "${n}" = "0" ] && [ "${rc}" = "0" ] && rm -f "${OUT}/churn/run-${i}.log"
            echo "run ${i}: exit ${rc}, ${n} report(s)"
          done
          echo "churn: ${reported} of ${RUNS} runs with a TSan report, ${failed} of ${RUNS} failed" | tee "${OUT}/churn-summary.txt"
          [ "${failed}" = "0" ]

      - name: Disassemble the functions in question
        if: always()
        run: |
          ELF_CHURN="${BIN}/areg-timer-churn-test.elf"
          ELF_UNIT="${BIN}/areg-unit-tests.elf"
          OWNERS='EventDispatcherBase|EventConsumer|NolockSyncObject|ResourceListMap|static_initialization|EventStack|LogManager::instance|EventDispatcher::|DispatcherThread'
          for e in "${ELF_CHURN}" "${ELF_UNIT}"; do
            [ -f "${e}" ] || continue
            b="$(basename "${e}" .elf)"
            "${DIAG}/fn-calls.sh" "${e}" 'areg::TimerManager::_remove_all_timers\(\)' > "${OUT}/${b}.remove_all_timers.txt" 2>&1 || true
            "${DIAG}/foreign-inlines.sh" "${e}" 'EventConsumerList|NolockSyncObject' "${OWNERS}" > "${OUT}/${b}.foreign-inlines.txt" 2>&1 || true
          done
          if [ -f "${ELF_UNIT}" ]; then
            nm -C -S --defined-only "${ELF_UNIT}" | grep -E 'StackBase<int|StackTest_test_lock_and_nolock_stack_search' > "${OUT}/stack-symbols.txt" || true
            line="$(nm -C -S --defined-only "${ELF_UNIT}" | grep -E ' [tT] StackTest_test_lock_and_nolock_stack_search_Test::TestBody\(\)$' | head -n 1)"
            if [ -n "${line}" ]; then
              set -- ${line}
              objdump -d -C -l --no-show-raw-insn --start-address=$((16#$1)) --stop-address=$((16#$1 + 16#$2)) "${ELF_UNIT}" \
                | sed 's#/home/runner/work/areg-sdk/areg-sdk/src/##' > "${OUT}/stacktest-search.asm"
            fi
          fi
          size "${BIN}"/*.elf > "${OUT}/size.txt" 2>&1 || true
          {
            echo "SpinLock::lock calls in _remove_all_timers: $(grep -c 'SpinLock::lock' "${OUT}/areg-timer-churn-test.remove_all_timers.txt" || true)"
            echo "foreign Nolock frames in the churn test   : $(grep -c '<=' "${OUT}/areg-timer-churn-test.foreign-inlines.txt" || true)"
            echo "foreign Nolock frames in the unit tests   : $(grep -c '<=' "${OUT}/areg-unit-tests.foreign-inlines.txt" || true)"
          } | tee "${OUT}/disasm-summary.txt"
          cat "${OUT}/areg-timer-churn-test.remove_all_timers.txt" || true

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{matrix.v.name}}"
            echo '```'
            head -n 5 "${OUT}/provenance.txt"
            echo "unit tests (ctest) : ${{steps.ctest.outcome}}"
            echo "StackTest x3       : ${{steps.stack.outcome}}"
            cat "${OUT}/churn-summary.txt" 2>/dev/null || true
            cat "${OUT}/disasm-summary.txt" 2>/dev/null || true
            grep -E '^\[  FAILED  \]|Failure' "${OUT}/stacktest.log" 2>/dev/null | sort | uniq -c | head -n 20 || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the binaries
        if: always()
        run: |
          mkdir -p "${OUT}/bin"
          cp "${BIN}/areg-unit-tests.elf" "${BIN}/areg-timer-churn-test.elf" "${OUT}/bin/" 2>/dev/null || true
          cp "${TREE}/compile_commands.json" "${OUT}/" 2>/dev/null || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-linux-${{matrix.v.name}}
          path: ${{github.workspace}}/out/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the leg when a check failed
        if: always()
        run: |
          [ "${{steps.ctest.outcome}}" != "failure" ] && [ "${{steps.stack.outcome}}" != "failure" ] && [ "${{steps.churn.outcome}}" != "failure" ]

  macos:
    name: macos try-send (bug 150)
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Ensure Xcode CLI Tools
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Add the diagnostic test
        run: |
          set -euo pipefail
          cp .github/diag/SocketWouldBlockDiag.cpp tests/units/
          perl -pi -e 's/^([ \t]*)SocketWouldBlockTest\.cpp$/$1SocketWouldBlockTest.cpp\n$1SocketWouldBlockDiag.cpp/' tests/units/CMakeLists.txt
          grep -n 'SocketWouldBlock' tests/units/CMakeLists.txt
          grep -q 'SocketWouldBlockDiag.cpp' tests/units/CMakeLists.txt

      # The configuration of the failing job macos-clang-static-noext-nolog, without the examples.
      - name: Configure and build the unit tests
        run: |
          cmake -B ./product/cache/llvm-clang++ -DAREG_COMPILER=clang -DCMAKE_BUILD_TYPE=Release \
                -DAREG_LIB_TYPE=static -DAREG_EXTENDED:BOOL=OFF -DAREG_LOGGING:BOOL=OFF \
                -DAREG_EXAMPLES:BOOL=OFF -DAREG_TESTS:BOOL=ON -DAREG_NO_EXCEPTIONS:BOOL=OFF
          cmake --build ./product/cache/llvm-clang++ --config Release --target areg-unit-tests -j8
          BIN="$(find ./product -type f -name 'areg-unit-tests*' -perm -u+x | head -n 1)"
          echo "BIN=${BIN}" >> "${GITHUB_ENV}"
          { sw_vers; uname -a; clang++ --version | head -n 1; echo "binary: ${BIN}"; } | tee provenance.txt

      - name: Repeat the failing test in one process
        id: inproc
        continue-on-error: true
        run: |
          rc=0
          "${BIN}" --gtest_filter='SocketWouldBlockTest.TrySendOnFullSocketReturnsAtOnce' --gtest_repeat=500 > original-inprocess.log 2>&1 || rc=$?
          echo "original, one process : $(grep -c '^\[  FAILED  \] SocketWouldBlockTest.TrySendOnFullSocketReturnsAtOnce (' original-inprocess.log) of 500 failed" | tee -a summary.txt
          exit ${rc}

      - name: Repeat the failing test, one process per run
        id: perproc
        continue-on-error: true
        run: |
          failed=0
          for i in $(seq 1 200); do
            "${BIN}" --gtest_filter='SocketWouldBlockTest.TrySendOnFullSocketReturnsAtOnce' >> original-perprocess.log 2>&1 || failed=$((failed + 1))
          done
          echo "original, per process : ${failed} of 200 failed" | tee -a summary.txt
          [ "${failed}" = "0" ]

      - name: Run the diagnostic
        id: diag
        continue-on-error: true
        run: |
          rc=0
          "${BIN}" --gtest_filter='SocketWouldBlockDiag.*' --gtest_repeat=500 > diag.log 2>&1 || rc=$?
          for t in OriginalFill SettledFill SettledFillFixedBuf; do
            echo "diag ${t} : $(grep -c "DIAG150 ${t} HIT" diag.log) of 500 found room" | tee -a summary.txt
          done
          exit ${rc}

      - name: Summary
        if: always()
        run: |
          {
            echo "### macos try-send (bug 150)"
            echo '```'
            cat provenance.txt summary.txt 2>/dev/null
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          grep -m 40 'DIAG150' diag.log || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-macos
          path: |
            provenance.txt
            summary.txt
            original-inprocess.log
            original-perprocess.log
            diag.log
          if-no-files-found: warn

      - name: Fail the job when a check failed
        if: always()
        run: |
          [ "${{steps.inproc.outcome}}" != "failure" ] && [ "${{steps.perproc.outcome}}" != "failure" ] && [ "${{steps.diag.outcome}}" != "failure" ]
