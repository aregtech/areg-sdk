name: REUSE compliance check

on:
  push:         # Keep empty to run on each branch when push the code. Otherwise use branches: [ master ]
    branches: [ master ]
  pull_request: # Set to master to run only when merge with master branch
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    # Temporary: skipped on the branch that probes the macOS stall, see macos-probe-thread.yml.
    if: github.head_ref != 'bugfix/799-example-23-client-does-not-quit' && github.ref_name != 'bugfix/799-example-23-client-does-not-quit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
