name: REUSE compliance check

# Only the manual trigger is active while the CMake workflow is used to hunt a defect.
# Restore the 'push' and 'pull_request' triggers when the hunt is over.
on:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
