name: Benchmarks

# Builds and runs the benchmarks and reports their numbers on the page of the run.
# The numbers come from a shared build server, so they are a report only: the job
# fails when the benchmarks do not build or do not run, never because of a number.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the sources
        uses: actions/checkout@v7

      - name: Build the benchmarks
        run: |
          cmake -B ./build \
                -DCMAKE_BUILD_TYPE=Release \
                -DAREG_COMPILER_FAMILY=gnu \
                -DAREG_LIB_TYPE=static \
                -DAREG_BENCHMARKS=ON \
                -DAREG_TESTS=OFF \
                -DAREG_EXAMPLES=OFF \
                -DAREG_INSTALL=OFF \
                -DAREG_BIN_DIR=${{github.workspace}}/build/bin
          cmake --build ./build --target areg-benchmarks -j $(nproc)

      - name: Run the benchmarks
        run: |
          ./build/bin/areg-benchmarks.elf \
                --benchmark_out=./build/benchmarks.json \
                --benchmark_out_format=json

      - name: Report the results
        if: always()
        run: |
          if [ -f ./build/benchmarks.json ]; then
            python3 ./tools/intern/benchmark_summary.py ./build/benchmarks.json "$GITHUB_STEP_SUMMARY"
          else
            echo "No benchmark results to report."
          fi

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: ./build/benchmarks.json
          if-no-files-found: ignore
