# Measures how a connection configured by the framework notices a dead peer, on the
# three platforms: the effective keepalive values, the time to detect a peer whose
# packets are dropped (with the connection idle and with data in flight), and whether a
# short loss kills a healthy idle connection. Runs by hand, or on a push that changes the
# files listed below; the result is the job summary and an artifact per platform.
#
# Packets are dropped on the loopback interface: iptables on Linux, pf on macOS. The
# Windows firewall cannot drop loopback packets, so Windows prints the report only.
name: Keepalive probe

on:
  # A push runs it only when the probe, this file or the socket configuration changes.
  push:
    paths:
      - 'tests/keepalive-probe/**'
      - '.github/workflows/keepalive-probe.yml'
      - 'framework/areg/base/private/posix/SocketDefsPosix.cpp'
      - 'framework/areg/base/private/win32/SocketDefsWin32.cpp'
  workflow_dispatch:
    inputs:
      limit:
        description: 'seconds each dead-peer scenario may take before it is reported as not detected'
        required: false
        default: '1500'
      blips:
        description: 'drop durations in seconds for the blip scenario (Linux)'
        required: false
        default: '2,3,4,6'

permissions:
  contents: read

jobs:

  probe:
    name: ${{matrix.os}}
    runs-on: ${{matrix.os}}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B ./build \
                -DCMAKE_BUILD_TYPE=Release \
                -DAREG_LIB_TYPE=static \
                -DAREG_EXAMPLES:BOOL=OFF \
                -DAREG_TESTS:BOOL=ON \
                -DAREG_INSTALL:BOOL=OFF \
                -DAREG_OUTPUT_LAYOUT:BOOL=OFF

      - name: Build the probe
        shell: bash
        run: cmake --build ./build --config Release --target areg-keepalive-probe -j8

      - name: Run the probe
        shell: bash
        run: |
          PYTHON="$(command -v python3 || command -v python)"
          "${PYTHON}" tests/keepalive-probe/keepalive_probe.py \
                  --search ./build ./product \
                  --limit ${{ github.event.inputs.limit || '1500' }} \
                  --blips "${{ github.event.inputs.blips || '2,3,4,6' }}" \
                  --out "keepalive-${{matrix.os}}.md"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keepalive-${{matrix.os}}
          path: keepalive-${{matrix.os}}.md
          retention-days: 14
