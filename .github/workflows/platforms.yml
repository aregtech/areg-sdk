name: Platforms

# Builds for other targets than the runner's own: 32-bit x86 Linux, built and tested on
# the x86_64 runner, and 32-bit ARM Linux, cross-compiled.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  # A Lock or ScopedLock that could not take its object ends the test process (FatalError.hpp).
  AREG_LOCK_FAILURE_FATAL: 1

jobs:
  plan:
    name: plan
    # Sets 'run' when the change touches a file this workflow checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(framework|examples|tests|thirdparty|conf)/|(^|/)CMakeLists\.txt$|\.cmake$|^tools/(codegen\.jar|schema/)|^tools/intern/(run-all-examples\.py|hang-watchdog\.sh|report-ctest\.py|check_invariants\.py|check_inline_virtuals\.py)$|^\.github/(ci/|workflows/platforms\.yml)|^tests/bitness/'
          MATRIX: ''
        run: |
          case "${EVENT}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push)         BASE="${{ github.event.before }}" ;;
            *)            BASE="" ;;
          esac
          RUN=true
          if [ -n "${BASE}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git diff --name-only "${BASE}" "${GITHUB_SHA}" | grep -qE "${PATTERN}" || RUN=false
          fi
          echo "run=${RUN}" >> "${GITHUB_OUTPUT}"
          if [ -n "${MATRIX}" ]; then
            echo "matrix=$(jq -c --arg ev "${EVENT}" '[.[] | select($ev != "push" or .master == true)]' "${MATRIX}")" >> "${GITHUB_OUTPUT}"
          fi

  linux-x86:
    # 32-bit x86 Linux, selected with AREG_ARCH=x86. Builds, runs every example and the
    # unit tests on the x86_64 runner.
    name: linux-gnu-x86-shared-all-test
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CACHE_DEST: ./product/cache/x86

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Install the 32-bit compiler and libraries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib g++-multilib libncurses-dev:i386 gdb

      - name: Configure CMake for 32-bit x86
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ${{env.CACHE_DEST}} -DAREG_ARCH=x86 -DAREG_COMPILER_FAMILY=gnu -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAREG_LIB_TYPE=shared -DAREG_EXTENDED:BOOL=ON -DAREG_LOGGING:BOOL=ON -DAREG_EXAMPLES:BOOL=ON -DAREG_TESTS:BOOL=ON -DAREG_SYSTEM_PACKAGES:BOOL=OFF -DAREG_SYSTEM_SQLITE:BOOL=OFF -DAREG_INSTALL:BOOL=OFF

      - name: Dump the CMake logs of a failed configuration
        if: failure()
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          for f in ${{env.CACHE_DEST}}/CMakeFiles/CMakeConfigureLog.yaml ${{env.CACHE_DEST}}/CMakeFiles/CMakeError.log; do
            if [ -f "${f}" ]; then echo "===== ${f} ====="; tail -n 300 "${f}"; fi
          done

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        run: cmake --build ${{env.CACHE_DEST}} -j16

      - name: Check the binaries are 32-bit
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          if [ -z "${BIN_DIR}" ]; then echo "no bin directory under ./product/build" >&2; exit 1; fi
          echo "BIN_DIR=${BIN_DIR}" >> "${GITHUB_ENV}"
          file "${BIN_DIR}/libareg.so"
          file "${BIN_DIR}/libareg.so" | grep -q 'ELF 32-bit' || { echo "libareg.so is not a 32-bit binary" >&2; exit 1; }

      - name: Write core dumps into the workspace
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          sudo sysctl -w kernel.core_pattern="${{github.workspace}}/cores/core.%e.%p" > /dev/null
          sudo sysctl -w kernel.core_uses_pid=0 > /dev/null
          sudo sysctl -w kernel.yama.ptrace_scope=0 > /dev/null || true

      - name: Run example applications
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 25
        run: |
          ulimit -c unlimited || true
          python3 tools/intern/run-all-examples.py --bin-dir "${{env.BIN_DIR}}" --tier all \
                  --out-dir ./example-results/linux-gnu-x86

      - name: Run Unit Tests
        working-directory: ${{github.workspace}}
        timeout-minutes: 30
        run: ctest --test-dir ${{env.CACHE_DEST}} -C ${{env.BUILD_TYPE}} --timeout 180 --output-on-failure --output-junit test_results.xml

      - name: Build the 64-bit side of the bitness test
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ./product/cache/x64 -DAREG_COMPILER_FAMILY=gnu -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAREG_LIB_TYPE=shared -DAREG_EXTENDED:BOOL=OFF -DAREG_LOGGING:BOOL=ON -DAREG_EXAMPLES:BOOL=OFF -DAREG_TESTS:BOOL=ON -DAREG_SYSTEM_PACKAGES:BOOL=OFF -DAREG_SYSTEM_SQLITE:BOOL=OFF -DAREG_INSTALL:BOOL=OFF
          cmake --build ./product/cache/x64 --target areg-bitness-test mtrouter -j16

      - name: Run the 32-bit and 64-bit processes together
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 10
        run: |
          BIN64="$(find ./product/build -type d -path '*linux-64*' -name bin 2>/dev/null | head -n 1)"
          if [ -z "${BIN64}" ]; then echo "no 64-bit bin directory under ./product/build" >&2; exit 1; fi
          bash tests/bitness/bitness.sh --bin64 "${BIN64}" --bin32 "${{env.BIN_DIR}}"

      - name: Report the failed unit tests
        if: failure()
        working-directory: ${{github.workspace}}
        shell: bash
        continue-on-error: true
        run: python3 tools/intern/report-ctest.py "${{env.CACHE_DEST}}"

      - name: Copy test artifacts if tests fail
        if: failure()
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          DEST="./linux-gnu-x86"
          mkdir -p "${DEST}"
          if [ -n "${BIN_DIR:-}" ] && [ -d "${BIN_DIR}" ]; then cp -R "${BIN_DIR}/" "${DEST}/bin/" || true; fi
          cp -R ./example-results/linux-gnu-x86/ "${DEST}/example-results/" || true
          cp -R ./cores/                         "${DEST}/cores/"           || true

      - name: Upload artifacts if tests fail
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-gnu-x86
          path: ./linux-gnu-x86/

  cross-arm32:
    # 32-bit ARM Linux (armhf), cross-compiled with the toolchain file the SDK ships.
    # Builds the libraries and the service binaries, then prints their sizes.
    name: linux-gnu-arm32-cross-${{matrix.config.logs == 'ON' && 'log' || 'nolog'}}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - { logs: ON  }
          - { logs: OFF }

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Install the armhf cross-compiler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf binutils-arm-linux-gnueabihf

      - name: Configure CMake with the arm32 toolchain
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ./product/cache/arm32 -DCMAKE_TOOLCHAIN_FILE=./conf/toolchains/gnu-linux-arm32.cmake -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAREG_LIB_TYPE=shared -DAREG_EXTENDED:BOOL=OFF -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=OFF -DAREG_TESTS:BOOL=OFF -DAREG_SYSTEM_PACKAGES:BOOL=OFF -DAREG_SYSTEM_SQLITE:BOOL=OFF -DAREG_INSTALL:BOOL=OFF

      - name: Dump the CMake logs of a failed configuration
        if: failure()
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          for f in ./product/cache/arm32/CMakeFiles/CMakeConfigureLog.yaml ./product/cache/arm32/CMakeFiles/CMakeError.log; do
            if [ -f "${f}" ]; then echo "===== ${f} ====="; tail -n 300 "${f}"; fi
          done

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        run: cmake --build ./product/cache/arm32 -j16

      - name: Report the binary sizes
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          if [ -z "${BIN_DIR}" ]; then echo "no bin directory under ./product/build" >&2; exit 1; fi
          file "${BIN_DIR}/libareg.so"
          file "${BIN_DIR}/libareg.so" | grep -q 'ARM' || { echo "libareg.so is not an ARM binary" >&2; exit 1; }
          arm-linux-gnueabihf-size "${BIN_DIR}"/*.so "${BIN_DIR}"/*.elf

  result:
    name: Platforms result
    if: always()
    needs: [plan, linux-x86, cross-arm32]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
