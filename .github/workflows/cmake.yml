name: CMake

on:
  push:         # Keep empty to run on each branch when push the code. Otherwise use branches: [ master ]
    branches: [ master ]
  pull_request: # Set to master to run only when merge with master branch
    branches: [ master ]
  workflow_dispatch:

# A newer push to the same branch makes the run already in flight obsolete.
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-tests:
    name: ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        # Two kinds of entry, and every entry is one or the other:
        #
        #   '*-all-test'  builds the framework, the extensions, the examples and the unit
        #                 tests, then runs all of them. This is what proves run time
        #                 behaviour, so both library types are covered on every platform.
        #   '*-nolog',    builds and installs only. These exist because 'AREG_LOGGING=OFF'
        #   '*-noext'     and 'AREG_EXTENDED=OFF' remove code from every translation unit
        #                 of the framework and no '*-all-test' entry compiles them, so
        #                 without these a configuration that a user can select would break
        #                 unnoticed. They also select the compiler by name rather than by
        #                 family (see the two configure steps), which is the second way the
        #                 build system can be driven.
        #
        # An entry that only repeats an active one with fewer things switched on is not
        # here: it costs a build server as much as the entry it duplicates and proves less.
        config: # Create matrix with combinations

            # compile Areg engine as a static library with GNU g++ / gcc on Ubuntu Linux, enable Areg extensions, logs, examples and tests
          - { name  : linux-gnu-static-all-test,
              os    : ubuntu-latest,
              lib   : static,
              family: gnu,
              cxx   : g++,
              cc    : gcc,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with GNU g++ / gcc on Ubuntu Linux, enable Areg extensions, logs, examples and tests
          - { name  : linux-gnu-shared-all-test,
              os    : ubuntu-latest,
              lib   : shared,
              family: gnu,
              cxx   : g++,
              cc    : gcc,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with GNU g++ / gcc on Ubuntu Linux, enable Areg extensions and no logs
          - { name  : linux-gnu-shared-ext-nolog,
              os    : ubuntu-latest,
              lib   : shared,
              family: gnu,
              cxx   : g++,
              cc    : gcc,
              extend: ON,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a shared library with GNU g++ / gcc on Ubuntu Linux, disable Areg extensions and no logs
          - { name  : linux-gnu-shared-noext-nolog,
              os    : ubuntu-latest,
              lib   : shared,
              family: gnu,
              cxx   : g++,
              cc    : gcc,
              extend: OFF,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a static library with clang on Ubuntu Linux, enable Areg extensions, logs, examples and tests
          - { name  : linux-clang-static-all-test,
              os    : ubuntu-latest,
              lib   : static,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with clang on Ubuntu Linux, enable Areg extensions, logs, examples and tests
          - { name  : linux-clang-shared-all-test,
              os    : ubuntu-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with clang on Ubuntu Linux, enable Areg extensions and no logs
          - { name  : linux-clang-shared-ext-nolog,
              os    : ubuntu-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: ON,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a shared library with clang on Ubuntu Linux, disable Areg extensions and no logs
          - { name  : linux-clang-shared-noext-nolog,
              os    : ubuntu-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: OFF,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a shared library with clang on macOS, enable logs and tests, disable Areg extensions
          - { name  : macos-clang-shared-noext,
              os    : macos-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: OFF,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with clang on macOS, enable tests, disable Areg extensions and no logs
          - { name  : macos-clang-shared-noext-nolog,
              os    : macos-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: OFF,
              logs  : OFF,
              test  : ON
            }

            # compile Areg engine as a static library with clang on macOS, enable logs and tests, disable Areg extensions
          - { name  : macos-clang-static-noext,
              os    : macos-latest,
              lib   : static,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: OFF,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a static library with clang on macOS, enable tests, disable Areg extensions and no logs
          - { name  : macos-clang-static-noext-nolog,
              os    : macos-latest,
              lib   : static,
              family: llvm,
              cxx   : clang++,
              cc    : clang,
              extend: OFF,
              logs  : OFF,
              test  : ON
            }

            # compile Areg engine as a static library with CYGWIN g++ / gcc on Windows, enable Areg extensions, logs, examples and tests
          - { name  : win-cygwin-static-all-test,
              os    : windows-latest,
              lib   : static,
              family: cygwin,
              cxx   : g++,
              cc    : gcc,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with CYGWIN g++ / gcc on Windows, enable Areg extensions, logs, examples and tests
          - { name  : win-cygwin-shared-all-test,
              os    : windows-latest,
              lib   : shared,
              family: cygwin,
              cxx   : g++,
              cc    : gcc,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with CYGWIN g++ / gcc on Windows, enable Areg extensions and no logs
          - { name  : win-cygwin-shared-ext-nolog,
              os    : windows-latest,
              lib   : shared,
              family: cygwin,
              cxx   : g++,
              cc    : gcc,
              extend: ON,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a shared library with CYGWIN g++ / gcc on Windows, disable Areg extensions and no logs
          - { name  : win-cygwin-shared-noext-nolog,
              os    : windows-latest,
              lib   : shared,
              family: cygwin,
              cxx   : g++,
              cc    : gcc,
              extend: OFF,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a static library with clang on Windows, enable Areg extensions, logs, examples and tests
          - { name  : win-clang-static-all-test,
              os    : windows-latest,
              lib   : static,
              family: llvm,
              cxx   : clang-cl,
              cc    : clang-cl,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with clang on Windows, enable Areg extensions, logs, examples and tests
          - { name  : win-clang-shared-all-test,
              os    : windows-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang-cl,
              cc    : clang-cl,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with clang on Windows, enable Areg extensions and no logs
          - { name  : win-clang-shared-ext-nolog,
              os    : windows-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang-cl,
              cc    : clang-cl,
              extend: ON,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a shared library with clang on Windows, disable Areg extensions and no logs
          - { name  : win-clang-shared-noext-nolog,
              os    : windows-latest,
              lib   : shared,
              family: llvm,
              cxx   : clang-cl,
              cc    : clang-cl,
              extend: OFF,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a static library with MSVC on Windows, enable Areg extensions, logs, examples and tests
          - { name  : win-msvc-static-all-test,
              os    : windows-latest,
              lib   : static,
              family: msvc,
              cxx   : cl,
              cc    : cl,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with MSVC on Windows, enable Areg extensions, logs, examples and tests
          - { name  : win-msvc-shared-all-test,
              os    : windows-latest,
              lib   : shared,
              family: msvc,
              cxx   : cl,
              cc    : cl,
              extend: ON,
              logs  : ON,
              test  : ON
            }

            # compile Areg engine as a shared library with MSVC on Windows, enable Areg extensions and no logs
          - { name  : win-msvc-shared-ext-nolog,
              os    : windows-latest,
              lib   : shared,
              family: msvc,
              cxx   : cl,
              cc    : cl,
              extend: ON,
              logs  : OFF,
              test  : OFF
            }

            # compile Areg engine as a shared library with MSVC on Windows, disable Areg extensions and no logs
          - { name  : win-msvc-shared-noext-nolog,
              os    : windows-latest,
              lib   : shared,
              family: msvc,
              cxx   : cl,
              cc    : cl,
              extend: OFF,
              logs  : OFF,
              test  : OFF
            }

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Set the cmake cache and install destinations
        shell: bash
        run: |
          echo "CACHE_DEST=./product/cache/${{matrix.config.family}}-${{matrix.config.cxx}}"     >> "${GITHUB_ENV}"
          echo "INSTALL_DEST=./product/install/${{matrix.config.family}}-${{matrix.config.cxx}}" >> "${GITHUB_ENV}"

      - name: Ensure Xcode CLI Tools
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Set Windows PATH environment variable
        if: matrix.config.family == 'cygwin'
        # The cygwin jobs see the cygwin toolchain and the Windows system directories,
        # and nothing else.
        #
        # '%PATH%' and '%SYSTEMROOT%' are not expanded when they are written into
        # GITHUB_ENV, so they are spelled out here through the PowerShell environment.
        # Appending the whole runner PATH instead is not an option: the run that did so
        # reported 'Detecting CXX compiler ABI info - failed' for both compilers, which
        # leaves CMAKE_SIZEOF_VOID_P undefined and stops the configuration. The runner
        # image carries three further GNU toolchains -- 'C:\mingw64\bin',
        # 'C:\Strawberry\c\bin' and 'C:\Program Files\Git\usr\bin' -- that have no
        # business being visible to a cygwin build.
        run: echo "PATH=C:\cygwin;C:\cygwin\bin;C:\cygwin\lib;$env:SYSTEMROOT\system32;$env:SYSTEMROOT;$env:SYSTEMROOT\System32\Wbem" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cygwin on Windows
        if: matrix.config.family == 'cygwin'
        uses: cygwin/cygwin-install-action@v6
        with:
          # 'gdb' is for the evidence path: a cygwin python reports the system as
          # CYGWIN_NT and not as Windows, so the example driver photographs a hung
          # process with gdb rather than with a Windows debugger.
          packages: cmake, dos2unix, flexdll, gcc-g++, gdb, git, libncurses-devel, make, python3
          install-dir: 'C:\cygwin'
          add-to-path: false
          work-vol: 'C:'

      - name: Resolve the python 3 interpreter
        if: matrix.config.test == 'ON'
        shell: bash
        # Resolved once and passed on, because the example driver, the benchmarks and the
        # ctest report all need it and the answer differs per runner.
        #
        # A candidate has to be executable from this shell, not only present. The cygwin
        # 'python3' is a cygwin symlink, which the Git bash of the runner sees as a plain
        # file and cannot start, so a candidate is verified by actually running it. The
        # versioned cygwin interpreters are real executables and are picked up by the
        # glob, which is empty everywhere except on the cygwin runners.
        run: |
          PY=""
          for candidate in python3 python py $(ls /c/cygwin/bin/python3*.exe 2>/dev/null); do
            if "${candidate}" -c "import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)" > /dev/null 2>&1; then
              PY="${candidate}"
              break
            fi
          done
          if [ -z "${PY}" ]; then echo "python 3 is required to run the examples" >&2; exit 1; fi
          echo "PY=${PY}" >> "${GITHUB_ENV}"
          echo "example driver interpreter: ${PY} ($("${PY}" --version 2>&1))"

      - name: Configure CMake by selecting compiler family
        if: matrix.config.extend == 'ON'
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ${{env.CACHE_DEST}} -DAREG_COMPILER_FAMILY=${{matrix.config.family}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAREG_LIB_TYPE=${{matrix.config.lib}} -DAREG_EXTENDED:BOOL=${{matrix.config.extend}} -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=${{matrix.config.test}} -DAREG_TESTS:BOOL=${{matrix.config.test}} -DAREG_INSTALL:BOOL=ON -DAREG_INSTALL_DIR:PATH="${{env.INSTALL_DEST}}"

      - name: Configure CMake by selecting compiler name
        if: matrix.config.extend == 'OFF'
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ${{env.CACHE_DEST}} -DAREG_COMPILER=${{matrix.config.cc}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAREG_LIB_TYPE=${{matrix.config.lib}} -DAREG_EXTENDED:BOOL=${{matrix.config.extend}} -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=${{matrix.config.test}} -DAREG_TESTS:BOOL=${{matrix.config.test}} -DAREG_INSTALL:BOOL=ON -DAREG_INSTALL_DIR:PATH="${{env.INSTALL_DEST}}"

      - name: Dump the CMake logs of a failed configuration
        if: failure()
        working-directory: ${{github.workspace}}
        shell: bash
        # A failed compiler check writes the command line and the compiler output into
        # these files and into nothing else. Without them a message such as
        # 'Detecting CXX compiler ABI info - failed' carries no cause.
        run: |
          for f in "${{env.CACHE_DEST}}/CMakeFiles/CMakeConfigureLog.yaml" \
                   "${{env.CACHE_DEST}}/CMakeFiles/CMakeError.log" \
                   "${{env.CACHE_DEST}}/CMakeFiles/CMakeOutput.log"; do
            if [ -f "${f}" ]; then
              echo "===== ${f} ====="
              tail -n 300 "${f}"
            fi
          done

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        run: cmake --build ${{env.CACHE_DEST}} --config ${{env.BUILD_TYPE}} -j16

      - name: Locate the build output directory
        working-directory: ${{github.workspace}}
        shell: bash
        # The folder name is built from the compiler and the target platform, so it
        # cannot be spelled out per runner. Take it from the build that just finished.
        run: |
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          if [ -n "${BIN_DIR}" ]; then
            echo "BUILD_DEST=$(dirname "${BIN_DIR}")" >> "${GITHUB_ENV}"
          else
            echo "BUILD_DEST=${{env.CACHE_DEST}}" >> "${GITHUB_ENV}"
          fi

      - name: Install with CMake
        working-directory: ${{github.workspace}}
        run: cmake --install ${{env.CACHE_DEST}} --config ${{env.BUILD_TYPE}}

      - name: Build the exported example against the installed package
        # Every job installs the SDK and, until this step, nothing checked that what was
        # installed can be consumed. This builds 'conf/exports/example' -- the project
        # that conf/exports/example/ReadMe.md hands to a user -- against the install that
        # was just produced, so a broken 'areg-config.cmake', a header that is not
        # installed or a renamed exported target fails here and not in the first build of
        # somebody who downloaded a release.
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          # CMAKE_PREFIX_PATH has to be an absolute path in the form the cmake of this
          # runner understands: the Git bash of the Windows runners drives a native cmake,
          # which wants 'D:/a/...', while a cygwin cmake wants '/cygdrive/d/a/...'.
          case "$(uname -s)" in
            MINGW*|MSYS*) PREFIX="$(cd "${{env.INSTALL_DEST}}" && pwd -W)" ;;
            *)            PREFIX="$(cd "${{env.INSTALL_DEST}}" && pwd)"    ;;
          esac
          echo "installed package prefix: ${PREFIX}"
          cmake -S ./conf/exports/example -B ./product/cache/export-example \
                -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_PREFIX_PATH="${PREFIX}"
          cmake --build ./product/cache/export-example --config ${{env.BUILD_TYPE}}

      - name: Write core dumps into the workspace
        # A crashing example leaves a core next to the binaries, so the uploaded artifact
        # carries the stack of the failure and not only the captured output.
        #
        # ptrace_scope is lowered for the same reason: a process that hangs instead of
        # crashing is photographed by the driver with gdb before it is killed, and the
        # default Ubuntu setting lets a debugger attach only to its own descendants.
        if: runner.os == 'Linux' && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          sudo sysctl -w kernel.core_pattern="${{github.workspace}}/cores/core.%e.%p" > /dev/null
          sudo sysctl -w kernel.core_uses_pid=0 > /dev/null
          sudo sysctl -w kernel.yama.ptrace_scope=0 > /dev/null || true
          which gdb || sudo apt-get install -y -qq gdb || true

      - name: Run example applications. Ignore if examples are not compiled
        if: matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 25
        run: |
          ulimit -c unlimited || true
          BIN_DIR="${{env.BUILD_DEST}}/bin"
          if [ -d "${BIN_DIR}" ]; then BIN_ARG="--bin-dir ${BIN_DIR}"; else BIN_ARG=""; fi
          "${{env.PY}}" tools/run-all-examples.py ${BIN_ARG} --tier all \
                  --out-dir "./example-results/${{matrix.config.name}}"

      - name: Run Unit Tests. Ignore if unit tests are not compiled
        if: matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        # '-C' is what makes this work on Windows. No generator is named when the project
        # is configured, so the Windows runners get the Visual Studio generator, which is
        # a multi configuration one. There, the executable of a target lives in a
        # per configuration directory, so a test registered as
        #
        #     add_test(NAME areg-release-unload-test COMMAND areg-release-unload-test)
        #
        # -- tests/release-unload/CMakeLists.txt -- has no command until a configuration
        # is named. A ctest that is not given one reports the case as 'Not Run' and exits
        # 8 without running a single test. A single configuration generator has no
        # configuration to filter by, so the option changes nothing there.
        run: ctest --test-dir ${{env.CACHE_DEST}} -C ${{env.BUILD_TYPE}} --output-on-failure --output-junit test_results.xml

      - name: Run the benchmarks and publish the measured rates
        # Runs last and cannot fail the job. A shared build server is a noisy place to
        # measure, so these numbers are a trend line and not an acceptance criterion --
        # but they are printed into the job log and published as annotations, so a
        # regression is visible in a browser without downloading an artifact.
        # The raw console streams stay in the artifact next to 'benchmarks.csv'.
        if: matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 40
        continue-on-error: true
        run: |
          BIN_DIR="${{env.BUILD_DEST}}/bin"
          if [ -d "${BIN_DIR}" ]; then BIN_ARG="--bin-dir ${BIN_DIR}"; else BIN_ARG=""; fi
          "${{env.PY}}" tools/run-all-examples.py ${BIN_ARG} --tier perf \
                  --out-dir "./example-results/${{matrix.config.name}}-benchmarks"

      - name: Report the failed unit tests
        # ctest prints the failure into the job log, which is not readable without a
        # credential. An annotation is, so the names of the failed tests and the output
        # each of them produced are published as annotations.
        #
        # This step must never fail and must never be skipped by a non-zero status of its
        # own: it runs because something else already failed, and it is the only evidence
        # that leaves the job.
        if: failure() && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        continue-on-error: true
        run: |
          "${{env.PY}}" tools/report-ctest.py "${{env.CACHE_DEST}}"

      - name: Collect the macOS crash reports
        # macOS does not write core files, it writes a crash report per process into the
        # diagnostic directory. Without this step a SIGSEGV on macOS leaves nothing to read
        # but the exit status.
        if: failure() && runner.os == 'macOS' && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          for dir in "${HOME}/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "${dir}" ]; then cp -R "${dir}/." ./cores/ || true; fi
          done
          ls -l ./cores/ || true

      - name: Copy test artifacts if tests fail. Ignore if tests are not compiled
        if: failure() && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        # Nothing here may fail the job: this step runs because something else already
        # failed, and its only purpose is to save whatever evidence exists. When the build
        # itself failed, BUILD_DEST was never set and the binary directory is looked up
        # again instead of expanding to './/bin/'.
        run: |
          DEST="./${{matrix.config.name}}"
          mkdir -p "${DEST}"
          BIN_DIR="${{env.BUILD_DEST}}/bin"
          if [ ! -d "${BIN_DIR}" ]; then
            BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          fi
          if [ -n "${BIN_DIR}" ] && [ -d "${BIN_DIR}" ]; then cp -R "${BIN_DIR}/" "${DEST}/bin/" || true; fi
          cp -R ./${{env.INSTALL_DEST}}/                   "${DEST}/"                  || true
          cp -R ./example-results/${{matrix.config.name}}/ "${DEST}/example-results/"  || true
          cp -R ./cores/                                   "${DEST}/cores/"            || true
          find "${DEST}" -maxdepth 2 | head -n 40

      - name: Upload artifacts if tests fail. Ignore if unit tests are not compiled
        if: failure() && matrix.config.test == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.config.name}}
          path: ./${{matrix.config.name}}/

  ubsan-linux:
    name: ubsan (linux-gnu-static)
    # The undefined behaviour sanitizer over the whole example suite.
    #
    # It is here permanently, and not only for the defect that introduced it. Its 'vptr'
    # check is what detects a downcast of an object to a type it never had -- the defect
    # class that broke 18_pubworker and that no compiler warning and no unit test finds.
    # The count is at zero for the framework and this job is what keeps it there.
    #
    # The build is static because 'vptr' needs every translation unit of the program
    # instrumented; reports of a shared build are dominated by false positives raised at
    # the uninstrumented library boundary.
    #
    # The sanitizer writes into files and not to standard error on purpose. Its reports
    # would otherwise land in the middle of the captured output of the examples and turn
    # every expectation into a false failure.
    #
    # Reports only, it never fails the workflow: a report names a place to look at, and a
    # sanitizer finding is not by itself a reason to hold a release.
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Configure CMake with the undefined behaviour sanitizer
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ./product/cache/ubsan -DAREG_COMPILER_FAMILY=gnu -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DAREG_LIB_TYPE=static -DAREG_EXTENDED:BOOL=ON -DAREG_LOGGING:BOOL=ON \
                -DAREG_EXAMPLES:BOOL=ON -DAREG_TESTS:BOOL=OFF \
                -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
                -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        run: cmake --build ./product/cache/ubsan -j16

      - name: Run the examples under the sanitizer
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 45
        continue-on-error: true
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:log_path=${{github.workspace}}/ubsan/report
        run: |
          mkdir -p ./ubsan
          sudo sysctl -w kernel.yama.ptrace_scope=0 > /dev/null || true
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          python3 tools/run-all-examples.py --bin-dir "${BIN_DIR}" --tier all \
                  --out-dir ./ubsan/example-results

      - name: Report what the sanitizer found
        if: always()
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          COUNT="$(cat ./ubsan/report.* 2>/dev/null | grep -c 'runtime error:' || true)"
          if [ "${COUNT}" = "0" ] || [ -z "${COUNT}" ]; then
            echo "::notice title=ubsan::the sanitizer reported nothing"
            exit 0
          fi
          echo "::warning title=ubsan::${COUNT} report(s), see the artifact"
          # Every report carries the address of the object it was raised on, and that
          # address differs on each run, so a plain 'sort -u' deduplicates nothing and the
          # annotation budget is spent on one place repeated eight times. The address is
          # removed before the reports are counted per place.
          #
          # The reports of the framework are separated from the reports of the examples
          # and published first. A defect of the framework affects every application built
          # on it; a defect of an example affects that example.
          cat ./ubsan/report.* 2>/dev/null | grep 'runtime error:' \
            | sed -e 's/0x[0-9a-f]*/<address>/g' -e 's#^.*/areg-sdk/##' \
            | sort | uniq -c | sort -rn > ./ubsan/by-place.txt
          echo "distinct places: $(wc -l < ./ubsan/by-place.txt)"
          # Two traps that once hid the whole report, do not reintroduce them:
          #
          # 1. The sed above strips everything up to and including the last '/areg-sdk/', so a
          #    framework line reads 'framework/areg/...' with NO leading slash. A pattern
          #    '/framework/' therefore never matches and every framework report is filed as an
          #    example report.
          # 2. 'grep' exits 1 when it matches nothing, which under 'set -e' kills the step and
          #    throws away every list below it. An empty framework list is the good outcome, not
          #    a failure, so neither grep may decide the exit status of this step.
          FRAMEWORK_RE='^[[:space:]]*[0-9]+[[:space:]]+framework/'
          { grep -E "${FRAMEWORK_RE}" ./ubsan/by-place.txt || true; } | head -n 6 \
            | while IFS= read -r line; do echo "::error title=ubsan-framework::${line}"; done
          { grep -Ev "${FRAMEWORK_RE}" ./ubsan/by-place.txt || true; } | head -n 8 \
            | while IFS= read -r line; do echo "::warning title=ubsan-example::${line}"; done
          # The kinds of check that fired, whatever the place. A kind that appears here and
          # nowhere in the two lists above is a place that lost the budget, not a place that
          # does not exist.
          sed -e 's/^.*runtime error: //' -e 's/0x[0-9a-f]*/<address>/g' ./ubsan/by-place.txt \
            | sed -e "s/'[^']*'/'T'/g" | sort | uniq -c | sort -rn | head -n 20 | tr '\n' '|' \
            | sed 's/^/::notice title=ubsan-kinds::/'

      - name: Upload the sanitizer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubsan-linux
          path: ./ubsan/
