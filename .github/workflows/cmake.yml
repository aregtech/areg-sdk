    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v5.6.0
        with: 
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Set cmake cache destination for Linux
        if: matrix.config.os == 'ubuntu-latest'
        run: |
            echo "CACHE_DEST=./product/cache/${{matrix.config.family}}-${{matrix.config.cxx}}" >> "$GITHUB_ENV"
            echo "INSTALL_DEST=./product/install/${{matrix.config.family}}-${{matrix.config.cxx}}" >> "$GITHUB_ENV"

      - name: Set cmake cache destination for macOS
        if: matrix.config.os == 'macos-latest'
        run: |
            ARCH=$(uname -m)
            echo "CACHE_DEST=./product/cache/${{matrix.config.family}}-${{matrix.config.cxx}}" >> "$GITHUB_ENV"
            echo "INSTALL_DEST=./product/install/${{matrix.config.family}}-${{matrix.config.cxx}}" >> "$GITHUB_ENV"

      - name: Set cmake cache destination for Windows
        if: matrix.config.os == 'windows-latest'
        run: |
            echo "CACHE_DEST=./product/cache/${{matrix.config.family}}-${{matrix.config.cxx}}" >> $env:GITHUB_ENV
            echo "INSTALL_DEST=./product/install/${{matrix.config.family}}-${{matrix.config.cxx}}" >> $env:GITHUB_ENV

      - name: Ensure Xcode CLI Tools
        if: matrix.config.os == 'macos-latest'
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Set Windows PATH environment variable
        if: matrix.config.family == 'cygwin'
        # The cygwin jobs see the cygwin toolchain and the Windows system directories,
        # and nothing else.
        #
        # '%PATH%' and '%SYSTEMROOT%' are not expanded when they are written into
        # GITHUB_ENV, so they are spelled out here through the PowerShell environment.
        # Appending the whole runner PATH instead is not an option: the run that did so
        # reported 'Detecting CXX compiler ABI info - failed' for both compilers, which
        # leaves CMAKE_SIZEOF_VOID_P undefined and stops the configuration. The runner
        # image carries three further GNU toolchains -- 'C:\mingw64\bin',
        # 'C:\Strawberry\c\bin' and 'C:\Program Files\Git\usr\bin' -- that have no
        # business being visible to a cygwin build.
        run: echo "PATH=C:\cygwin;C:\cygwin\bin;C:\cygwin\lib;$env:SYSTEMROOT\system32;$env:SYSTEMROOT;$env:SYSTEMROOT\System32\Wbem" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cygwin on Windows
        if: matrix.config.os == 'windows-latest' && matrix.config.family == 'cygwin'
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: cmake, dos2unix, flexdll, gcc-g++, git, libncurses-devel, make, python3
          install-dir: 'C:\cygwin'
          add-to-path: false
          work-vol: 'C:'

      - name: create build and product directories
        working-directory: ${{github.workspace}}
        run: |
            mkdir build
            mkdir product

      - name: Configure CMake by selecting compiler family
        if: matrix.config.extend == 'ON'
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ${{env.CACHE_DEST}} -DAREG_COMPILER_FAMILY=${{matrix.config.family}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAREG_LIB_TYPE=${{matrix.config.lib}} -DAREG_EXTENDED:BOOL=${{matrix.config.extend}} -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=${{matrix.config.test}} -DAREG_TESTS:BOOL=${{matrix.config.test}} -DAREG_INSTALL:BOOL=ON -DAREG_INSTALL_DIR:PATH="${{env.INSTALL_DEST}}"

      - name: Configure CMake by selecting compiler name
        if: matrix.config.extend == 'OFF'
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ${{env.CACHE_DEST}} -DAREG_COMPILER=${{matrix.config.cc}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAREG_LIB_TYPE=${{matrix.config.lib}} -DAREG_EXTENDED:BOOL=${{matrix.config.extend}} -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=${{matrix.config.test}} -DAREG_TESTS:BOOL=${{matrix.config.test}} -DAREG_INSTALL:BOOL=ON -DAREG_INSTALL_DIR:PATH="${{env.INSTALL_DEST}}"

      - name: Dump the CMake logs of a failed configuration
        if: failure()
        working-directory: ${{github.workspace}}
        shell: bash
        # A failed compiler check writes the command line and the compiler output into
        # these files and into nothing else. Without them a message such as
        # 'Detecting CXX compiler ABI info - failed' carries no cause.
        run: |
          for f in "${{env.CACHE_DEST}}/CMakeFiles/CMakeConfigureLog.yaml" \
                   "${{env.CACHE_DEST}}/CMakeFiles/CMakeError.log" \
                   "${{env.CACHE_DEST}}/CMakeFiles/CMakeOutput.log"; do
            if [ -f "${f}" ]; then
              echo "===== ${f} ====="
              tail -n 300 "${f}"
            fi
          done

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        # Build your program with the given configuration
        run: cmake --build ${{env.CACHE_DEST}} --config ${{env.BUILD_TYPE}} -j16

      - name: Locate the build output directory
        working-directory: ${{github.workspace}}
        shell: bash
        # The folder name is built from the compiler and the target platform, so it
        # cannot be spelled out per runner. Take it from the build that just finished.
        run: |
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          if [ -n "${BIN_DIR}" ]; then
            echo "BUILD_DEST=$(dirname "${BIN_DIR}")" >> "${GITHUB_ENV}"
          else
            echo "BUILD_DEST=${{env.CACHE_DEST}}" >> "${GITHUB_ENV}"
          fi

      - name: Show how the compiler translated the custom event dispatch
        # TEMPORARY, bug-fixing phase. Delete together with the 18_pubworker defect.
        #
        # 18_pubworker fails on one Linux configuration and passes on the three others
        # built from the same source, and the captured output of the failing one contains
        # six bytes that read as a pointer where a formatted line is expected. A failure
        # of that shape is a difference in code generation, and the only place it can be
        # read is the binary that produced it. The dump is taken from every Linux
        # configuration, failing or not, so that the two can be compared directly.
        #
        # It runs before the examples so that the annotation budget of the job is spent
        # on it first. Nothing here may fail the job.
        if: runner.os == 'Linux' && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        continue-on-error: true
        run: |
          ${{matrix.config.cxx}} --version | head -n 1
          echo "::notice title=compiler-${{matrix.config.name}}::$(${{matrix.config.cxx}} --version | head -n 1)"
          python3 tools/dump-symbol-asm.py "${{env.BUILD_DEST}}/bin/18_pubclient.elf" \
                  "start_event_processing" \
                  --title "asm-${{matrix.config.name}}"

      - name: Install with CMake
        working-directory: ${{github.workspace}}
        # Install the binaries and headers
        run: cmake --install ${{env.CACHE_DEST}} --config ${{env.BUILD_TYPE}}

      - name: Write core dumps into the workspace
        # A crashing example leaves a core next to the binaries, so the uploaded artifact
        # carries the stack of the failure and not only the captured output.
        #
        # ptrace_scope is lowered for the same reason: a process that hangs instead of
        # crashing is photographed by the driver with gdb before it is killed, and the
        # default Ubuntu setting lets a debugger attach only to its own descendants.
        if: runner.os == 'Linux' && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          sudo sysctl -w kernel.core_pattern="${{github.workspace}}/cores/core.%e.%p" > /dev/null
          sudo sysctl -w kernel.core_uses_pid=0 > /dev/null
          sudo sysctl -w kernel.yama.ptrace_scope=0 > /dev/null || true
          which gdb || sudo apt-get install -y -qq gdb || true

      - name: Run example applications. Ignore if examples are not compiled
        if: matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 25
        run: |
          ulimit -c unlimited || true
          # A candidate has to be executable from this shell, not only present. The cygwin
          # 'python3' is a cygwin symlink, which the Git bash of the runner sees as a plain
          # file and cannot start, so the candidate is verified by actually running it.
          # The versioned cygwin interpreters are real executables and are picked up by
          # the glob; it is empty everywhere except on the cygwin runners.
          PY=""
          for candidate in python3 python py $(ls /c/cygwin/bin/python3*.exe 2>/dev/null); do
            if "${candidate}" -c "import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)" > /dev/null 2>&1; then
              PY="${candidate}"
              break
            fi
          done
          if [ -z "${PY}" ]; then echo "python 3 is required to run the examples" >&2; exit 1; fi
          echo "example driver interpreter: ${PY} ($(${PY} --version 2>&1))"
          BIN_DIR="${{env.BUILD_DEST}}/bin"
          if [ -d "${BIN_DIR}" ]; then BIN_ARG="--bin-dir ${BIN_DIR}"; else BIN_ARG=""; fi
          "${PY}" tools/run-all-examples.py ${BIN_ARG} --tier all \
                  --out-dir "./example-results/${{matrix.config.name}}"

      - name: Run Unit Tests. Ignore if unit tests are not compiled
        if: matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        run: ctest --test-dir ${{env.CACHE_DEST}} --output-on-failure --output-junit test_results.xml

      - name: Report the failed unit tests
        # ctest prints the failure into the job log, which is not readable without a
        # credential. An annotation is, so the names of the failed tests and the tail of
        # their output are published as one.
        if: failure() && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          LOG="${{env.CACHE_DEST}}/Testing/Temporary/LastTest.log"
          if [ ! -f "${LOG}" ]; then echo "::warning title=ctest::no ${LOG}"; exit 0; fi
          NAMES="$(grep -E '^[0-9]+/[0-9]+ Test .*(Failed|Exception)' "${LOG}" | tr '\n' ';')"
          echo "::error title=ctest::${NAMES:-no failed test line in LastTest.log}"
          tail -n 60 "${LOG}" | tr '\n' '|' | sed 's/^/::notice title=ctest-tail::/'

      - name: Collect the macOS crash reports
        # macOS does not write core files, it writes a crash report per process into the
        # diagnostic directory. Without this step a SIGSEGV on macOS leaves nothing to read
        # but the exit status.
        if: failure() && runner.os == 'macOS' && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          for dir in "${HOME}/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "${dir}" ]; then cp -R "${dir}/." ./cores/ || true; fi
          done
          ls -l ./cores/ || true

      - name: Copy test artifacts if tests fail. Ignore if tests are not compiled
        if: failure() && matrix.config.test == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        # Nothing here may fail the job: this step runs because something else already failed,
        # and its only purpose is to save whatever evidence exists. When the build itself failed, 
        # BUILD_DEST was never set and the binary directory is looked up again instead of expanding to './/bin/'.
        run: |
          DEST="./${{matrix.config.name}}"
          mkdir -p "${DEST}"
          BIN_DIR="${{env.BUILD_DEST}}/bin"
          if [ ! -d "${BIN_DIR}" ]; then
            BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          fi
          if [ -n "${BIN_DIR}" ] && [ -d "${BIN_DIR}" ]; then cp -R "${BIN_DIR}/" "${DEST}/bin/" || true; fi
          cp -R ./${{env.INSTALL_DEST}}/                   "${DEST}/"                 || true
          cp -R ./example-results/${{matrix.config.name}}/ "${DEST}/example-results/"  || true
          cp -R ./cores/                                   "${DEST}/cores/"            || true
          find "${DEST}" -maxdepth 2 | head -n 40

      - name: Upload artifacts if tests fail. Ignore if unit tests are not compiled
        if: failure() && matrix.config.test == 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.config.name}}
          path: ./${{matrix.config.name}}/

  repro-debug:
    name: repro-debug (linux-gnu-static)
    # Runs only after the matrix above failed. It rebuilds one Linux configuration with
    # debug information, repeats the example run and the unit tests, and uploads the
    # binaries, the debug information and the core dumps of whatever crashed, so that
    # the failure can be replayed and read in a debugger locally.
    #
    # RelWithDebInfo and not Debug on purpose: the failures that reach this job are
    # timing dependent, and an unoptimized build changes the timing enough to hide them.
    #
    # SWITCHED OFF. It rebuilds linux-gnu-static, the configuration that passes, and in
    # run 1500 it reproduced nothing and reported success while two other jobs failed.
    # The evidence now comes from the disassembly step, the sanitizer job and the
    # backtraces the driver takes itself, none of which needs a second build.
    # Restore by putting 'failure()' back in place of 'false'.
    needs: build-tests
    if: false
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Configure CMake with debug information
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ./product/cache/repro -DAREG_COMPILER_FAMILY=gnu -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DAREG_LIB_TYPE=static -DAREG_EXTENDED:BOOL=ON -DAREG_LOGGING:BOOL=ON \
                -DAREG_EXAMPLES:BOOL=ON -DAREG_TESTS:BOOL=ON

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        run: cmake --build ./product/cache/repro -j16

      - name: Locate the build output directory
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          echo "REPRO_DEST=$(dirname "${BIN_DIR}")" >> "${GITHUB_ENV}"

      - name: Write core dumps into the workspace
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          sudo sysctl -w kernel.core_pattern="${{github.workspace}}/cores/core.%e.%p" > /dev/null
          sudo sysctl -w kernel.core_uses_pid=0 > /dev/null

      - name: Repeat the example applications
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 60
        continue-on-error: true
        run: |
          ulimit -c unlimited || true
          python3 tools/run-all-examples.py --bin-dir "${{env.REPRO_DEST}}/bin" --tier all --repeat 3 \
                  --out-dir ./example-results/repro-debug

      - name: Run Unit Tests
        working-directory: ${{github.workspace}}
        continue-on-error: true
        run: ctest --test-dir ./product/cache/repro --output-on-failure --output-junit test_results.xml

      - name: Collect the reproduction artifacts
        if: always()
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./repro-debug
          cp -R "${{env.REPRO_DEST}}/bin/"        ./repro-debug/bin/            || true
          cp -R ./example-results/repro-debug/    ./repro-debug/example-results/ || true
          cp -R ./cores/                          ./repro-debug/cores/           || true

      - name: Upload the reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repro-debug
          path: ./repro-debug/

  watchdog-hunt:
    name: watchdog-hunt (macos-clang-shared)
    # TEMPORARY, bug-fixing phase. Delete together with the macOS watchdog defect.
    #
    # 21_locwatchdog and 22_pubwatchdog hang on the macOS build server at random, one of
    # the two per job, and on no other platform. The artifacts of a normal run do not say
    # why: the captured output of the hung application is zero bytes, yet in one of the
    # cases the message router recorded real traffic, so the application clearly ran.
    #
    # Run 1500 answered the first question this job was written to ask. The two scenarios
    # on their own, four times each, in both capture modes, did not hang; the full suite
    # of the same run did. So the trigger is not in those two applications alone.
    #
    # Run 1501 answered the second and cost this job its build type. All four macOS matrix
    # jobs hung, all four on 22_pubwatchdog, while this job passed again. The matrix builds
    # Release and logs nothing; this job built RelWithDebInfo and logged ten scope groups
    # at DEBUG|SCOPE, 'areg_ipc_*' among them, which is a record per dispatched event. The
    # hunt was slower than the race it was hunting. It is now the matrix configuration --
    # Release, extensions off, shared -- and it runs the whole suite twice:
    #
    #   pass 1, shipped configuration -> does this build reproduce at all?
    #   pass 2, narrow scope set      -> the framework's own account of the hang
    #
    # If pass 1 hangs and pass 2 does not, the logging is still too heavy and the next step
    # is to narrow tools/enable-framework-logs.py further, not to widen it.
    #
    # The two focused capture modes are kept at the end because they still separate a
    # defect of the framework from a defect of the capture:
    #
    #   hangs with a terminal only   -> the capture is at fault, the framework is not
    #   hangs in both modes          -> the framework is at fault, and the backtraces
    #                                   taken before the kill name the place
    #
    # It runs on every push and does not gate anything: it never fails the workflow, it
    # only collects.
    runs-on: macos-latest
    continue-on-error: true

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Report the state of the debugger
        continue-on-error: true
        run: |
          xcrun lldb --version || true
          /usr/sbin/DevToolsSecurity -status || true

      - name: Configure CMake
        working-directory: ${{github.workspace}}
        run: |
          # Deliberately identical to the macos-clang-shared-noext matrix entry, which is
          # the configuration that reproduces. RelWithDebInfo did not.
          cmake -B ./product/cache/hunt -DAREG_COMPILER_FAMILY=llvm -DCMAKE_BUILD_TYPE=Release \
                -DAREG_LIB_TYPE=shared -DAREG_EXTENDED:BOOL=OFF -DAREG_LOGGING:BOOL=ON \
                -DAREG_EXAMPLES:BOOL=ON -DAREG_TESTS:BOOL=OFF

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        run: cmake --build ./product/cache/hunt -j16

      - name: Locate the build output directory
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          if [ -z "${BIN_DIR}" ]; then echo "::error title=watchdog-hunt::nothing was built"; exit 1; fi
          echo "HUNT_BIN=${BIN_DIR}" >> "${GITHUB_ENV}"

      - name: Pass 1, the whole suite exactly as it is shipped
        # No logging, nothing changed. The only question this pass asks is whether this
        # build reproduces what the matrix job of the same run reproduces. If it does not,
        # the difference is the build type or the machine, and pass 2 proves nothing.
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 45
        continue-on-error: true
        run: |
          python3 tools/run-all-examples.py --bin-dir "${{env.HUNT_BIN}}" --tier all \
                  --out-dir ./watchdog-hunt/pass1-shipped

      - name: Let the framework write and log its own scopes
        working-directory: ${{github.workspace}}
        shell: bash
        run: python3 tools/enable-framework-logs.py "${{env.HUNT_BIN}}/config/areg.init"

      - name: Pass 2, the whole suite with the framework logging its own restarts
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 45
        continue-on-error: true
        run: |
          python3 tools/run-all-examples.py --bin-dir "${{env.HUNT_BIN}}" --tier all \
                  --out-dir ./watchdog-hunt/pass2-logged

      - name: Publish what the framework logged about the watchdog applications
        # The artifact needs a credential to download, an annotation does not, and the
        # last lines of the log of a process that was killed are what says whether the
        # provider ever registered again and whether the consumer ever heard of it.
        if: always()
        working-directory: ${{github.workspace}}
        shell: bash
        continue-on-error: true
        run: |
          # A job publishes roughly ten annotations per level, so the tail is kept short
          # enough that three files fit. The whole log is in the artifact.
          python3 tools/annotate-file.py --title hunt-log --tail 80 --level warning \
                  --max-annotations 3 --max-files 3 \
                  "${{env.HUNT_BIN}}/logs/"'2[12]_*.log'

      - name: Hunt with a pseudo terminal
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 25
        continue-on-error: true
        run: |
          python3 tools/run-all-examples.py --bin-dir "${{env.HUNT_BIN}}" \
                  --only 21_locwatchdog,22_pubwatchdog --repeat 4 --keep-logs \
                  --out-dir ./watchdog-hunt/with-terminal

      - name: Hunt without a pseudo terminal
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 25
        continue-on-error: true
        run: |
          python3 tools/run-all-examples.py --bin-dir "${{env.HUNT_BIN}}" --no-pty \
                  --only 21_locwatchdog,22_pubwatchdog --repeat 4 --keep-logs \
                  --out-dir ./watchdog-hunt/without-terminal

      - name: Collect what the framework itself logged
        if: always()
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./watchdog-hunt/areg-logs
          cp -R "${{env.HUNT_BIN}}/logs/." ./watchdog-hunt/areg-logs/ 2>/dev/null || true
          for dir in "${HOME}/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "${dir}" ]; then cp -R "${dir}/." ./watchdog-hunt/areg-logs/ || true; fi
          done
          find ./watchdog-hunt -maxdepth 3 | head -n 60

      - name: Upload the hunt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: watchdog-hunt
          path: ./watchdog-hunt/

  ubsan-linux:
    name: ubsan (linux-gnu-static)
    # TEMPORARY, bug-fixing phase.
    #
    # The defect that broke 18_pubworker was an invalid downcast of an event to a type it
    # never had. The undefined behaviour sanitizer detects exactly that, through its
    # 'vptr' check, which is why this job exists and why the build is static: 'vptr'
    # needs every translation unit of the program instrumented, and reports of a shared
    # build are dominated by false positives from the uninstrumented library boundary.
    #
    # The sanitizer writes into files and not to standard error on purpose. Its reports
    # would otherwise land in the middle of the captured output of the examples and turn
    # every expectation into a false failure.
    #
    # Reports only, it never fails the workflow.
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v5.6.0
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Configure CMake with the undefined behaviour sanitizer
        working-directory: ${{github.workspace}}
        run: |
          cmake -B ./product/cache/ubsan -DAREG_COMPILER_FAMILY=gnu -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DAREG_LIB_TYPE=static -DAREG_EXTENDED:BOOL=ON -DAREG_LOGGING:BOOL=ON \
                -DAREG_EXAMPLES:BOOL=ON -DAREG_TESTS:BOOL=OFF \
                -DCMAKE_CXX_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined" \
                -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=undefined"

      - name: Build with CMake
        working-directory: ${{github.workspace}}
        run: cmake --build ./product/cache/ubsan -j16

      - name: Run the examples under the sanitizer
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 45
        continue-on-error: true
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0:log_path=${{github.workspace}}/ubsan/report
        run: |
          mkdir -p ./ubsan
          sudo sysctl -w kernel.yama.ptrace_scope=0 > /dev/null || true
          BIN_DIR="$(find ./product/build -type d -name bin 2>/dev/null | head -n 1)"
          python3 tools/run-all-examples.py --bin-dir "${BIN_DIR}" --tier all \
                  --out-dir ./ubsan/example-results

      - name: Report what the sanitizer found
        if: always()
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          COUNT="$(cat ./ubsan/report.* 2>/dev/null | grep -c 'runtime error:' || true)"
          if [ "${COUNT}" = "0" ] || [ -z "${COUNT}" ]; then
            echo "::notice title=ubsan::the sanitizer reported nothing"
            exit 0
          fi
          echo "::warning title=ubsan::${COUNT} report(s), see the artifact"
          # Every report carries the address of the object it was raised on, and that
          # address differs on each run, so a plain 'sort -u' deduplicates nothing and the
          # annotation budget is spent on one place repeated eight times. The address is
          # removed before the reports are counted per place.
          #
          # The reports of the framework are separated from the reports of the examples
          # and published first. A defect of the framework affects every application built
          # on it; a defect of an example affects that example.
          cat ./ubsan/report.* 2>/dev/null | grep 'runtime error:' \
            | sed -e 's/0x[0-9a-f]*/<address>/g' -e 's#^.*/areg-sdk/##' \
            | sort | uniq -c | sort -rn > ./ubsan/by-place.txt
          echo "distinct places: $(wc -l < ./ubsan/by-place.txt)"
          # 'grep' exits 1 when it matches nothing, which under 'set -e' kills the step and
          # throws away every list below it. An empty framework list is the good outcome, not
          # a failure, so neither grep may decide the exit status of this step.
          { grep '/framework/' ./ubsan/by-place.txt || true; } | head -n 6 \
            | while IFS= read -r line; do echo "::error title=ubsan-framework::${line}"; done
          { grep -v '/framework/' ./ubsan/by-place.txt || true; } | head -n 8 \
            | while IFS= read -r line; do echo "::warning title=ubsan-example::${line}"; done
          # The kinds of check that fired, whatever the place. A kind that appears here and
          # nowhere in the two lists above is a place that lost the budget, not a place that
          # does not exist.
          sed -e 's/^.*runtime error: //' -e 's/0x[0-9a-f]*/<address>/g' ./ubsan/by-place.txt \
            | sed -e "s/'[^']*'/'T'/g" | sort | uniq -c | sort -rn | head -n 20 | tr '\n' '|' \
            | sed 's/^/::notice title=ubsan-kinds::/'

      - name: Upload the sanitizer reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ubsan-linux
          path: ./ubsan/
