name: CMake

on:
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  # A Lock or ScopedLock that could not take its object ends the test process (FatalError.hpp).
  AREG_LOCK_FAILURE_FATAL: 1

jobs:
  plan:
    name: plan
    # Selects the event's legs and separates test runs from build-only configurations.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      priority_matrix: ${{ steps.plan.outputs.priority_matrix }}
      linux_matrix: ${{ steps.plan.outputs.linux_matrix }}
      windows_matrix: ${{ steps.plan.outputs.windows_matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(framework|examples|tests|thirdparty|conf)/|(^|/)CMakeLists\.txt$|\.cmake$|^tools/(codegen\.jar|schema/)|^tools/intern/(run-all-examples\.py|hang-watchdog\.sh|report-ctest\.py|check_invariants\.py|check_inline_virtuals\.py|ci-changes\.sh)$|^\.github/(actions/compiler-cache/|ci/|workflows/cmake\.yml)'
          MATRIX: '.github/ci/cmake-matrix.json'
        run: |
          case "${EVENT}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push)         BASE="${{ github.event.before }}" ;;
            *)            BASE="" ;;
          esac
          RUN=true
          if [ -n "${BASE}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            RUN="$(bash tools/intern/ci-changes.sh "${BASE}" "${GITHUB_SHA}" "${PATTERN}")"
          fi
          echo "run=${RUN}" >> "${GITHUB_OUTPUT}"
          SELECTED="$(jq -c --arg ev "${EVENT}" '[.[] | select($ev != "push" or .master == true)]' "${MATRIX}")"
          PRIORITY="$(jq -c '[.[] | select(.test == "ON" and .norun != "ON")]' <<< "${SELECTED}")"
          BACKGROUND="$(jq -c '[.[] | select(.test != "ON" or .norun == "ON")]' <<< "${SELECTED}")"
          if ! jq -e 'all(.[]; .os == "ubuntu-latest" or .os == "windows-latest")' <<< "${BACKGROUND}" > /dev/null; then
            echo "::error::A build-only runner needs its own matrix job in cmake.yml"
            exit 1
          fi
          echo "priority_matrix=${PRIORITY}" >> "${GITHUB_OUTPUT}"
          echo "linux_matrix=$(jq -c '[.[] | select(.os == "ubuntu-latest")]' <<< "${BACKGROUND}")" >> "${GITHUB_OUTPUT}"
          echo "windows_matrix=$(jq -c '[.[] | select(.os == "windows-latest")]' <<< "${BACKGROUND}")" >> "${GITHUB_OUTPUT}"

  # A pull request runs all legs in .github/ci/cmake-matrix.json; a push to master
  # runs those marked 'master: true'. Build-only concurrency is bounded separately.
  # '*-all-test' builds and runs the examples and the unit tests; 'norun: ON' builds them only.
  # 'bench: ON' also runs the benchmarks on a pull request; one shared library build per OS.
  # '*-nolog' and '*-noext' build and install only, with AREG_LOGGING=OFF or AREG_EXTENDED=OFF.
  # 'noexc: ON' compiles the framework without exceptions and RTTI.
  # 'btype' replaces BUILD_TYPE: MinSizeRel and RelWithDebInfo.
  build-tests:
    name: ${{matrix.config.name}}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{matrix.config.os}}
    timeout-minutes: 120

    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.priority_matrix) }}

    steps: &cmake-build-steps

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Cache compiler outputs
        id: compiler-cache
        if: runner.os != 'Windows' && matrix.config.test == 'ON' && matrix.config.norun != 'ON'
        uses: ./.github/actions/compiler-cache
        with:
          key: cmake-${{ matrix.config.name }}

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - name: Set the cmake cache and install destinations
        shell: bash
        run: |
          echo "CACHE_DEST=./product/cache/${{matrix.config.family}}-${{matrix.config.cxx}}"     >> "${GITHUB_ENV}"
          echo "INSTALL_DEST=./product/install/${{matrix.config.family}}-${{matrix.config.cxx}}" >> "${GITHUB_ENV}"

      - name: Ensure Xcode CLI Tools
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Let every git of the job trust the checkout directory
        if: matrix.config.family == 'cygwin'
        shell: bash
        run: |
          echo "GIT_CONFIG_COUNT=1"              >> "${GITHUB_ENV}"
          echo "GIT_CONFIG_KEY_0=safe.directory" >> "${GITHUB_ENV}"
          echo "GIT_CONFIG_VALUE_0=*"            >> "${GITHUB_ENV}"

      - name: Set Windows PATH environment variable
        if: matrix.config.family == 'cygwin'
        # Only the cygwin toolchain and the Windows system directories. The runner image
        # carries three further GNU toolchains that must not be visible to a cygwin build;
        # appending the whole runner PATH breaks the compiler ABI detection.
        run: echo "PATH=C:\cygwin;C:\cygwin\bin;C:\cygwin\lib;$env:SYSTEMROOT\system32;$env:SYSTEMROOT;$env:SYSTEMROOT\System32\Wbem" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install cygwin on Windows
        if: matrix.config.family == 'cygwin'
        uses: cygwin/cygwin-install-action@v7
        with:
          # 'gdb' is what the example driver uses to photograph a hung process on cygwin.
          packages: cmake, dos2unix, flexdll, gcc-g++, gdb, git, libncurses-devel, make, python3
          install-dir: 'C:\cygwin'
          add-to-path: false
          work-vol: 'C:'

      - name: Pin the cygwin libuv1 to 1.52.1
        if: matrix.config.family == 'cygwin'
        shell: pwsh
        # cmake under libuv1 1.53.0 waits forever for a child process that has already ended.
        run: |
          # Every mirror is tried in each round; the checksum below checks the file whichever mirror served it.
          $path = 'x86_64/release/libuv/libuv1/libuv1-1.52.1-1-x86_64.tar.xz'
          $mirrors = @('https://mirrors.kernel.org/sourceware/cygwin', 'https://cygwin.mirror.constant.com', 'https://mirrors.mit.edu/cygwin')
          $sha = 'bfeffaf2c576a58650b71f7057722f79166589bd1859b5546f8b64190a226e9417f6f1ae59529ad7db4ca3891034b17dba3fc2becdb3f4e81223890fe78298aa'
          $done = $false
          foreach ($try in 1..3) {
            foreach ($mirror in $mirrors) {
              try { Invoke-WebRequest -Uri "$mirror/$path" -OutFile C:\cygwin\tmp\libuv1.tar.xz -TimeoutSec 60; $done = $true; break }
              catch { Write-Output "Download from $mirror failed in round $try" }
            }
            if ($done) { break }
            Start-Sleep -Seconds (10 * $try)
          }
          if (-not $done) { throw 'libuv1 1.52.1: no mirror answered' }
          if ((Get-FileHash -Algorithm SHA512 C:\cygwin\tmp\libuv1.tar.xz).Hash -ne $sha) { throw 'libuv1 1.52.1: checksum mismatch' }
          C:\cygwin\bin\bash.exe -c 'tar -xJf /tmp/libuv1.tar.xz -C / && strings /usr/bin/cyguv-1.dll | grep -m1 -x "1\.[0-9]*\.[0-9]*"'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore the cygwin cygxml2-2.dll
        if: matrix.config.family == 'cygwin'
        shell: pwsh
        # cmake loads cygarchive-13.dll, which imports cygxml2-2.dll; libxml2 2.15 ships only cygxml2-16.dll.
        # Only the old DLL is added, the installed libxml2 stays as it is.
        run: |
          $path = 'x86_64/release/libxml2/libxml2-2.13.9-2-x86_64.tar.xz'
          $mirrors = @('https://mirrors.kernel.org/sourceware/cygwin', 'https://cygwin.mirror.constant.com', 'https://mirrors.mit.edu/cygwin')
          $sha = 'dbea2e2facd79238c8232f44f556db27ceaf87e53150167e9e28029ef81dca45a37dd3fd98dd810b90e82926ea95204c09fb7e16907cfc3ee93cae4298dd3758'
          if (Test-Path C:\cygwin\bin\cygxml2-2.dll) { Write-Output 'cygxml2-2.dll is installed'; exit 0 }
          $done = $false
          foreach ($try in 1..3) {
            foreach ($mirror in $mirrors) {
              try { Invoke-WebRequest -Uri "$mirror/$path" -OutFile C:\cygwin\tmp\libxml2.tar.xz -TimeoutSec 60; $done = $true; break }
              catch { Write-Output "Download from $mirror failed in round $try" }
            }
            if ($done) { break }
            Start-Sleep -Seconds (10 * $try)
          }
          if (-not $done) { throw 'libxml2 2.13.9: no mirror answered' }
          if ((Get-FileHash -Algorithm SHA512 C:\cygwin\tmp\libxml2.tar.xz).Hash -ne $sha) { throw 'libxml2 2.13.9: checksum mismatch' }
          C:\cygwin\bin\bash.exe -c 'tar -xJf /tmp/libxml2.tar.xz -C / usr/bin/cygxml2-2.dll && ls -l /usr/bin/cygxml2-*.dll && /usr/bin/cmake --version'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve the python 3 interpreter
        if: matrix.config.test == 'ON'
        shell: bash
        # A candidate is verified by running it: the cygwin 'python3' is a cygwin symlink
        # that the Git bash of the runner cannot start. The glob picks the real one.
        run: |
          PY=""
          if [ "${{matrix.config.family}}" = "cygwin" ]; then
            for candidate in /c/cygwin/bin/python3.*.exe /c/cygwin/bin/python3.exe; do
              [ -x "${candidate}" ] || continue
              if "${candidate}" -c "import platform,sys; sys.exit(0 if platform.system().startswith('CYGWIN') else 1)"; then
                PY="${candidate}"
                break
              fi
            done
            if [ -z "${PY}" ]; then
              echo "no cygwin python 3 interpreter found under /c/cygwin/bin" >&2
              ls -l /c/cygwin/bin/python3* || true
              exit 1
            fi
          else
            for candidate in python3 python py; do
              if "${candidate}" -c "import sys; sys.exit(0 if sys.version_info[0] == 3 else 1)" > /dev/null 2>&1; then
                PY="${candidate}"
                break
              fi
            done
          fi
          if [ -z "${PY}" ]; then echo "python 3 is required to run the examples" >&2; exit 1; fi
          echo "PY=${PY}" >> "${GITHUB_ENV}"
          echo "example driver interpreter: ${PY} ($("${PY}" --version 2>&1))"

      - name: Configure CMake by selecting compiler family
        if: matrix.config.extend == 'ON' && matrix.config.family != 'cygwin'
        working-directory: ${{github.workspace}}
        timeout-minutes: 15
        run: |
          cmake -B ${{env.CACHE_DEST}} -DAREG_COMPILER_FAMILY=${{matrix.config.family}} -DCMAKE_BUILD_TYPE=${{matrix.config.btype || env.BUILD_TYPE}} -DAREG_LIB_TYPE=${{matrix.config.lib}} -DAREG_EXTENDED:BOOL=${{matrix.config.extend}} -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=${{matrix.config.test}} -DAREG_TESTS:BOOL=${{matrix.config.test}} -DAREG_NO_EXCEPTIONS:BOOL=${{matrix.config.noexc || 'OFF'}} -DAREG_INSTALL:BOOL=ON -DAREG_INSTALL_DIR:PATH="${{env.INSTALL_DEST}}"

      - name: Configure CMake by selecting compiler family, watched (cygwin)
        if: matrix.config.extend == 'ON' && matrix.config.family == 'cygwin'
        working-directory: ${{github.workspace}}
        shell: pwsh
        timeout-minutes: 15
        # cmake runs from pwsh as in the step above. A cmake, java or cygpath process that runs
        # longer than 300 s gets its processes and its stacks printed, and is then stopped.
        run: |
          New-Item -ItemType Directory -Force product | Out-Null
          Remove-Item -Force -ErrorAction SilentlyContinue product/configure.done
          Start-Process -NoNewWindow -FilePath C:\cygwin\bin\bash.exe -ArgumentList 'tools/intern/hang-watchdog.sh product/configure.done 300 cmake java cygpath'
          cmake -B ${{env.CACHE_DEST}} -DAREG_COMPILER_FAMILY=${{matrix.config.family}} -DCMAKE_BUILD_TYPE=${{matrix.config.btype || env.BUILD_TYPE}} -DAREG_LIB_TYPE=${{matrix.config.lib}} -DAREG_EXTENDED:BOOL=${{matrix.config.extend}} -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=${{matrix.config.test}} -DAREG_TESTS:BOOL=${{matrix.config.test}} -DAREG_NO_EXCEPTIONS:BOOL=${{matrix.config.noexc || 'OFF'}} -DAREG_INSTALL:BOOL=ON -DAREG_INSTALL_DIR:PATH="${{env.INSTALL_DEST}}"
          $rc = $LASTEXITCODE
          New-Item -ItemType File -Force product/configure.done | Out-Null
          exit $rc

      - name: Configure CMake by selecting compiler name
        if: matrix.config.extend == 'OFF'
        working-directory: ${{github.workspace}}
        timeout-minutes: 15
        run: |
          cmake -B ${{env.CACHE_DEST}} -DAREG_COMPILER=${{matrix.config.cc}} -DCMAKE_BUILD_TYPE=${{matrix.config.btype || env.BUILD_TYPE}} -DAREG_LIB_TYPE=${{matrix.config.lib}} -DAREG_EXTENDED:BOOL=${{matrix.config.extend}} -DAREG_LOGGING:BOOL=${{matrix.config.logs}} -DAREG_EXAMPLES:BOOL=${{matrix.config.test}} -DAREG_TESTS:BOOL=${{matrix.config.test}} -DAREG_NO_EXCEPTIONS:BOOL=${{matrix.config.noexc || 'OFF'}} -DAREG_INSTALL:BOOL=ON -DAREG_INSTALL_DIR:PATH="${{env.INSTALL_DEST}}"

      - name: Check that a clang-cl leg is compiled by clang-cl
        if: matrix.config.cxx == 'clang-cl'
        shell: bash
        run: grep -H 'CMAKE_CXX_COMPILER_ID "Clang"' ${{env.CACHE_DEST}}/CMakeFiles/*/CMakeCXXCompiler.cmake

      - name: Dump the CMake logs of a failed configuration
        if: failure()
        working-directory: ${{github.workspace}}
        shell: bash
        # A failed compiler check writes its cause into these files and nowhere else.
        run: |
          for f in "${{env.CACHE_DEST}}/CMakeFiles/CMakeConfigureLog.yaml" \
                   "${{env.CACHE_DEST}}/CMakeFiles/CMakeError.log" \
                   "${{env.CACHE_DEST}}/CMakeFiles/CMakeOutput.log" \
                   "product/configure.done.report"; do
            if [ -f "${f}" ]; then
              echo "===== ${f} ====="
              tail -n 300 "${f}"
            fi
          done

      - name: Build with CMake
        id: build
        working-directory: ${{github.workspace}}
        run: cmake --build ${{env.CACHE_DEST}} --config ${{matrix.config.btype || env.BUILD_TYPE}} -j16

      - name: Report compiler cache statistics
        if: ${{ !cancelled() && steps.compiler-cache.outcome == 'success' }}
        run: ccache --show-stats

      - name: Locate the build output directory
        working-directory: ${{github.workspace}}
        shell: bash
        # The folder name is built from the compiler and the platform, so it is taken
        # from the build that just finished rather than spelled out per runner.
        run: |
          BIN_DIR="$(find ./product/build -type d -name bin -print -quit 2>/dev/null || true)"
          if [ -n "${BIN_DIR}" ]; then
            echo "BUILD_DEST=$(dirname "${BIN_DIR}")" >> "${GITHUB_ENV}"
          else
            echo "BUILD_DEST=${{env.CACHE_DEST}}" >> "${GITHUB_ENV}"
          fi

      - name: Verify the framework carries no exception tables and no RTTI
        if: matrix.config.noexc == 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        # The build already fails on a new 'throw' or 'dynamic_cast'. This also catches a
        # build setting that quietly puts the flags back.
        run: |
          LIB=""
          for candidate in "${{env.BUILD_DEST}}/bin/libareg.so" \
                           "${{env.BUILD_DEST}}/lib/libareg.a" \
                           "${{env.BUILD_DEST}}/bin/libareg.dylib"; do
            if [ -f "${candidate}" ]; then LIB="${candidate}"; break; fi
          done
          if [ -z "${LIB}" ]; then echo "no areg library under ${{env.BUILD_DEST}}" >&2; exit 1; fi
          echo "checking ${LIB}"
          if [ "$(uname -s)" != "Linux" ]; then
            echo "SKIPPED: the section and symbol check reads ELF; this runner is $(uname -s)"
            exit 0
          fi
          if readelf -SW "${LIB}" | grep -q '\.gcc_except_table'; then
            echo "FAILED: ${LIB} contains .gcc_except_table" >&2
            exit 1
          fi
          COUNT="$(nm -C --defined-only "${LIB}" | grep -c 'typeinfo' || true)"
          if [ "${COUNT}" -ne 0 ]; then
            echo "FAILED: ${LIB} defines ${COUNT} typeinfo symbols" >&2
            exit 1
          fi
          echo "OK: no exception tables, no RTTI"

      - name: Install with CMake
        working-directory: ${{github.workspace}}
        run: cmake --install ${{env.CACHE_DEST}} --config ${{matrix.config.btype || env.BUILD_TYPE}}

      - name: Write core dumps into the workspace
        # A crash leaves a core next to the binaries. ptrace_scope is lowered so the
        # driver can attach gdb to a hung process that is not its own descendant.
        if: runner.os == 'Linux' && matrix.config.test == 'ON' && matrix.config.norun != 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          sudo sysctl -w kernel.core_pattern="${{github.workspace}}/cores/core.%e.%p" > /dev/null
          sudo sysctl -w kernel.core_uses_pid=0 > /dev/null
          sudo sysctl -w kernel.yama.ptrace_scope=0 > /dev/null || true
          which gdb || sudo apt-get install -y -qq gdb || true

      - name: Run example applications. Ignore if examples are not compiled
        if: matrix.config.test == 'ON' && matrix.config.norun != 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 25
        run: |
          ulimit -c unlimited || true
          BIN_DIR="${{env.BUILD_DEST}}/bin"
          if [ -d "${BIN_DIR}" ]; then BIN_ARG="--bin-dir ${BIN_DIR}"; else BIN_ARG=""; fi
          "${{env.PY}}" tools/intern/run-all-examples.py ${BIN_ARG} --tier all \
                  --out-dir "./example-results/${{matrix.config.name}}"

      - name: Run Unit Tests. Ignore if unit tests are not compiled
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.config.test == 'ON' && matrix.config.norun != 'ON' && runner.os != 'macOS' }}
        working-directory: ${{github.workspace}}
        timeout-minutes: 30
        # '-C' is required on Windows: no generator is named. The Windows runners get
        # the multi configuration Visual Studio generator, where a test registered without
        # a configuration has no command and ctest exits 8 without running anything.
        run: ctest --test-dir ${{env.CACHE_DEST}} -C ${{matrix.config.btype || env.BUILD_TYPE}} --timeout 180 --output-on-failure --output-junit test_results.xml

      - name: Run Unit Tests, watched (macOS)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.config.test == 'ON' && matrix.config.norun != 'ON' && runner.os == 'macOS' }}
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 30
        # A test executable that runs longer than 120 s gets its processes and its stacks
        # printed, and is then stopped. ctest's own timeout would stop it without stacks.
        run: |
          rm -f product/unittests.done
          bash tools/intern/hang-watchdog.sh product/unittests.done 120 'areg-*' &
          rc=0
          ctest --test-dir ${{env.CACHE_DEST}} -C ${{matrix.config.btype || env.BUILD_TYPE}} --timeout 180 --output-on-failure --output-junit test_results.xml || rc=$?
          touch product/unittests.done
          wait
          exit ${rc}

      - name: Run the benchmarks and publish the measured rates
        # The measured rates are a trend line, not an acceptance criterion: a shared build
        # server is a noisy place to measure. They are published as annotations, readable
        # without an artifact, and a slow number never fails the step.
        # The step does fail when an application of a scenario crashes, hangs or does not
        # print what it must, because that is a defect and not a measurement.
        # Runs once per OS on a pull request, in the shared library build marked 'bench'.
        if: ${{ !cancelled() && steps.build.outcome == 'success' && matrix.config.test == 'ON' && matrix.config.norun != 'ON' && matrix.config.bench == 'ON' && github.event_name != 'push' }}
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 40
        run: |
          BIN_DIR="${{env.BUILD_DEST}}/bin"
          if [ -d "${BIN_DIR}" ]; then BIN_ARG="--bin-dir ${BIN_DIR}"; else BIN_ARG=""; fi
          "${{env.PY}}" tools/intern/run-all-examples.py ${BIN_ARG} --tier perf \
                  --out-dir "./example-results/${{matrix.config.name}}-benchmarks"

      - name: Report the failed unit tests
        # The job log needs a credential to read, an annotation does not. This step runs
        # because something else already failed, so it must never fail itself.
        if: failure() && matrix.config.test == 'ON' && matrix.config.norun != 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        continue-on-error: true
        run: |
          "${{env.PY}}" tools/intern/report-ctest.py "${{env.CACHE_DEST}}"

      - name: Collect the macOS crash reports
        # macOS writes a crash report per process instead of a core file.
        if: failure() && runner.os == 'macOS' && matrix.config.test == 'ON' && matrix.config.norun != 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ./cores
          for dir in "${HOME}/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
            if [ -d "${dir}" ]; then cp -R "${dir}/." ./cores/ || true; fi
          done
          ls -l ./cores/ || true

      - name: Copy test artifacts if tests fail. Ignore if tests are not compiled
        if: failure() && matrix.config.test == 'ON' && matrix.config.norun != 'ON'
        working-directory: ${{github.workspace}}
        shell: bash
        # Saves whatever evidence exists and must never fail. When the build itself
        # failed, BUILD_DEST was never set and the binary directory is looked up again.
        # Only a directory inside the workspace is copied.
        run: |
          DEST="./${{matrix.config.name}}"
          mkdir -p "${DEST}"
          WORKSPACE="$(pwd -P)"
          BIN_DIR=""
          if [ -n "${BUILD_DEST:-}" ] && [ -d "${BUILD_DEST}/bin" ]; then
            case "$(cd "${BUILD_DEST}/bin" && pwd -P)/" in
              "${WORKSPACE}/"*) BIN_DIR="${BUILD_DEST}/bin" ;;
              *) echo "ignored ${BUILD_DEST}/bin: not inside the workspace" ;;
            esac
          fi
          if [ -z "${BIN_DIR}" ] && [ -d ./product/build ]; then
            BIN_DIR="$(find ./product/build -type d -name bin -print -quit 2>/dev/null || true)"
          fi
          if [ -n "${BIN_DIR}" ]; then
            cp -R "${BIN_DIR}/" "${DEST}/bin/" || echo "could not copy ${BIN_DIR}"
          else
            echo "no build output directory to copy"
          fi
          cp -R ./${{env.INSTALL_DEST}}/                   "${DEST}/"                  || true
          cp -R ./example-results/${{matrix.config.name}}/          "${DEST}/example-results/"            || true
          cp -R ./example-results/${{matrix.config.name}}-benchmarks/ "${DEST}/example-results-benchmarks/" || true
          cp -R ./cores/                                   "${DEST}/cores/"            || true
          find "${DEST}" -maxdepth 2 | sed -n '1,40p'

      - name: Upload artifacts if tests fail. Ignore if unit tests are not compiled
        if: failure() && matrix.config.test == 'ON' && matrix.config.norun != 'ON'
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.config.name}}
          path: ./${{matrix.config.name}}/

  build-linux:
    name: ${{matrix.config.name}}
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.plan.outputs.linux_matrix != '[]' }}
    runs-on: ${{matrix.config.os}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.linux_matrix) }}
    steps: *cmake-build-steps

  build-windows:
    name: ${{matrix.config.name}}
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && needs.plan.outputs.windows_matrix != '[]' }}
    runs-on: ${{matrix.config.os}}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.windows_matrix) }}
    steps: *cmake-build-steps

  invariants:
    name: the framework invariants still have anchors
    # tools/intern/check_invariants.py seeds a defect per documented invariant, rebuilds and
    # asserts something goes red. The seeding needs a build per defect and is run by hand;
    # what rots first is the seed set itself, because a refactor moves the line it anchors to.
    # This step is that check, and it needs no compiler.
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check every seeded defect still applies to exactly one place
        run: python3 tools/intern/check_invariants.py --dry-run

      - name: Check workflow path decisions
        run: python3 tests/units/test_ci_plans.py

      # areg is a shared library: an inline virtual method can leave a client unable to link (bug 418).
      - name: Check no non-template class defines a virtual method inline
        run: python3 tools/intern/check_inline_virtuals.py

      # Visual Studio saves a resource script as UTF-16, which clang cannot read.
      - name: Check the encoding of every text file
        run: python3 tools/intern/check-ascii.py

  result:
    name: CMake result
    if: always()
    needs: [plan, build-tests, build-linux, build-windows, invariants]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
