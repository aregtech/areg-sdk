name: Coverage

# Line, function and branch coverage of framework/, measured with GCC '--coverage' in a
# Debug build on Linux and uploaded to Codecov. Each run makes one report per Codecov flag:
#   unit     -- the unit tests run by ctest;
#   examples -- the example applications run by tools/intern/run-all-examples.py.
# The counters are reset between the two runs, so a flag holds only what its own run reached;
# Codecov shows their union as the project total and in the README badge.
# The job summary holds the totals, per project and per directory. The artifact
# 'coverage-report' holds the HTML report, from project to directory to file and line.
# Codecov settings: .github/codecov.yml.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A Lock or ScopedLock that could not take its object ends the test process (FatalError.hpp).
  AREG_LOCK_FAILURE_FATAL: 1
  BUILD_DEST: ./product/coverage
  REPORT_DEST: ./product/coverage-report
  GCOVR_VERSION: '8.8'

jobs:
  plan:
    name: plan
    # Sets 'run' when the change touches a file that can change the measured coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(framework|examples|tests|thirdparty|conf)/|(^|/)CMakeLists\.txt$|\.cmake$|^tools/(codegen\.jar|schema/)|^tools/intern/(run-all-examples\.py|coverage-report\.py)$|^\.github/(codecov\.yml|workflows/coverage\.yml)'
        run: |
          case "${EVENT}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push)         BASE="${{ github.event.before }}" ;;
            *)            BASE="" ;;
          esac
          RUN=true
          if [ -n "${BASE}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git diff --name-only "${BASE}" "${GITHUB_SHA}" | grep -qE "${PATTERN}" || RUN=false
          fi
          echo "run=${RUN}" >> "${GITHUB_OUTPUT}"

  coverage:
    name: coverage (unit tests and examples)
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: Checkout Areg SDK source codes
        uses: actions/checkout@v7

      - name: Setup Java JDK to run code generator
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 17
          java-package: jre
          distribution: temurin

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install gcovr
        run: python -m pip install --disable-pip-version-check "gcovr==${{env.GCOVR_VERSION}}"

      # Debug is the only unoptimized configuration, so each line maps to its own counter.
      # '-fprofile-update=atomic' keeps the counters exact when several threads run one line.
      - name: Configure CMake with coverage instrumentation
        working-directory: ${{github.workspace}}
        timeout-minutes: 15
        run: |
          FLAGS="--coverage -fprofile-update=atomic"
          cmake -B ${{env.BUILD_DEST}} -DAREG_COMPILER_FAMILY=gnu -DCMAKE_BUILD_TYPE=Debug -DAREG_LIB_TYPE=shared \
                -DAREG_EXTENDED:BOOL=ON -DAREG_LOGGING:BOOL=ON -DAREG_EXAMPLES:BOOL=ON -DAREG_TESTS:BOOL=ON \
                -DAREG_OUTPUT_LAYOUT:BOOL=OFF \
                -DCMAKE_C_FLAGS="${FLAGS}" -DCMAKE_CXX_FLAGS="${FLAGS}" \
                -DCMAKE_EXE_LINKER_FLAGS="--coverage" -DCMAKE_SHARED_LINKER_FLAGS="--coverage"

      - name: Build with CMake
        id: build
        working-directory: ${{github.workspace}}
        run: cmake --build ${{env.BUILD_DEST}} -j $(nproc)

      - name: Run the unit tests
        id: unit
        working-directory: ${{github.workspace}}
        timeout-minutes: 40
        run: ctest --test-dir ${{env.BUILD_DEST}} --timeout 300 --output-on-failure

      - name: Collect the unit test coverage and reset the counters
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          mkdir -p ${{env.REPORT_DEST}}
          gcovr --root . --filter 'framework/' -j $(nproc) \
                --exclude-unreachable-branches --exclude-throw-branches \
                --json ${{env.REPORT_DEST}}/unit.json \
                ${{env.BUILD_DEST}}
          find ${{env.BUILD_DEST}} -name '*.gcda' -delete

      - name: Run the example applications
        id: examples
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{github.workspace}}
        shell: bash
        timeout-minutes: 40
        run: |
          python tools/intern/run-all-examples.py --bin-dir ${{env.BUILD_DEST}}/bin --tier all \
                 --out-dir ./example-results/coverage --summary ''

      - name: Collect the example coverage and make the reports
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          OUT=${{env.REPORT_DEST}}
          gcovr --root . --filter 'framework/' -j $(nproc) \
                --exclude-unreachable-branches --exclude-throw-branches \
                --json ${OUT}/examples.json \
                ${{env.BUILD_DEST}}
          for flag in unit examples; do
            gcovr --root . --json-add-tracefile ${OUT}/${flag}.json \
                  --cobertura ${OUT}/${flag}.xml --json-summary ${OUT}/${flag}-summary.json
          done
          mkdir -p ${OUT}/html
          gcovr --root . --json-add-tracefile ${OUT}/unit.json --json-add-tracefile ${OUT}/examples.json \
                --html-nested ${OUT}/html/index.html --html-title 'Areg SDK framework coverage' \
                --json-summary ${OUT}/total-summary.json --txt-summary
          python tools/intern/coverage-report.py --unit ${OUT}/unit-summary.json \
                 --examples ${OUT}/examples-summary.json --total ${OUT}/total-summary.json \
                 --summary "${GITHUB_STEP_SUMMARY}" | tee ${OUT}/coverage.md

      - name: Upload the unit test coverage to Codecov
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{env.REPORT_DEST}}/unit.xml
          flags: unit
          name: unit
          disable_search: true
          plugins: noop
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

      - name: Upload the example coverage to Codecov
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{env.REPORT_DEST}}/examples.xml
          flags: examples
          name: examples
          disable_search: true
          plugins: noop
          fail_ci_if_error: ${{ github.event_name != 'pull_request' }}

      - name: Upload the HTML coverage report
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ${{env.REPORT_DEST}}/html/
            ${{env.REPORT_DEST}}/coverage.md
            ${{env.REPORT_DEST}}/*-summary.json
          retention-days: 14

      - name: Upload the example output if a run fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-example-results
          path: ./example-results/coverage/
