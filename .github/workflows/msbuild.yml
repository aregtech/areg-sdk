name: MSBuild

on:
  push:         # Keep empty to run on each branch when push the code. Otherwise, use branches: [ master ]
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# A newer push to the same branch makes the run already in flight obsolete.
concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  plan:
    name: plan
    # Sets 'run' when the change touches a file this workflow checks.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PATTERN: '^(framework|examples|tests|thirdparty|conf)/|(^|/)CMakeLists\.txt$|\.cmake$|^tools/(codegen\.jar|schema/)|^tools/intern/(run-all-examples\.py|hang-watchdog\.sh|report-ctest\.py|check_invariants\.py|check_inline_virtuals\.py)$|^\.github/(ci/|workflows/msbuild\.yml)|\.(sln|vcxproj|filters|props|targets)$|(^|/)packages\.config$'
          MATRIX: ''
        run: |
          case "${EVENT}" in
            pull_request) BASE="${{ github.event.pull_request.base.sha }}" ;;
            push)         BASE="${{ github.event.before }}" ;;
            *)            BASE="" ;;
          esac
          RUN=true
          if [ -n "${BASE}" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git diff --name-only "${BASE}" "${GITHUB_SHA}" | grep -qE "${PATTERN}" || RUN=false
          fi
          echo "run=${RUN}" >> "${GITHUB_OUTPUT}"
          if [ -n "${MATRIX}" ]; then
            echo "matrix=$(jq -c --arg ev "${EVENT}" '[.[] | select($ev != "push" or .master == true)]' "${MATRIX}")" >> "${GITHUB_OUTPUT}"
          fi

  build-tests:
    name: ${{matrix.config.name}}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    # Pinned to windows-2022 (Visual Studio 2022) on purpose
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        config: # Create matrix with combinations
          # Compile for 32-bit platform, enabled Areg extensions and logs
          - {name: MSBuild-Win32-ext-log,     platform: Win32,  extend: 1,  logs: 1}
          # Compile for 64-bit platform, disabled Areg extensions and no logs
          - {name: MSBuild-x64-noext-nolog,   platform: x64,    extend: 0,  logs: 0}

    steps:
    - name: Checkout Areg engine (Areg SDK) source codes
      uses: actions/checkout@v7

    - name: Setup Java JDK to run code generator
      uses: actions/setup-java@v6.0.1
      with: 
        java-version: 17
        java-package: jre
        distribution: temurin

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      working-directory: ${{github.workspace}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build areg-sdk solution.
      working-directory: ${{github.workspace}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /property:Configuration=${{env.BUILD_CONFIGURATION}} /property:Platform=${{matrix.config.platform}} /property:AregExtended=${{matrix.config.extend}} /property:AregLogs=${{matrix.config.logs}} ${{env.SOLUTION_FILE_PATH}} -t:restore,build -p:RestorePackagesConfig=true

  result:
    name: MSBuild result
    if: always()
    needs: [plan, build-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail when a needed job failed or was cancelled
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "false"
