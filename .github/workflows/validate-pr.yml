name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  pr-check:
    # Temporary: skipped on the branch that probes the macOS stall, see macos-probe-thread.yml.
    if: github.head_ref != 'bugfix/799-example-23-client-does-not-quit' && github.ref_name != 'bugfix/799-example-23-client-does-not-quit'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Checklist
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const errors = [];

            if (!prBody.includes('[x] I have read CONTRIBUTING.md')) {
              errors.push('Please check the box confirming you have read CONTRIBUTING.md.');
            }
            if (!prBody.includes('Signed-off-by:')) {
              errors.push('Missing "Signed-off-by:" line in PR.');
            }
            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }
