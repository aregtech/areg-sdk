name: PR Validation

# Only the manual trigger is active while the CMake workflow is used to hunt a defect.
# Restore the 'pull_request' trigger when the hunt is over.
on:
  workflow_dispatch:

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Checklist
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || '';
            const errors = [];

            if (!prBody.includes('[x] I have read CONTRIBUTING.md')) {
              errors.push('Please check the box confirming you have read CONTRIBUTING.md.');
            }
            if (!prBody.includes('Signed-off-by:')) {
              errors.push('Missing "Signed-off-by:" line in PR.');
            }
            if (errors.length > 0) {
              core.setFailed(errors.join('\n'));
            }
