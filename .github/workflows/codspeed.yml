name: CodSpeed

on:
  push:         # Run on each push to the master branch to keep the performance baseline up to date.
    branches: [ master ]
  pull_request: # Required to report the performance changes of the pull requests.
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read  # required for actions/checkout
  id-token: write # required for OIDC authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout the sources
        uses: actions/checkout@v7

      - name: Build the benchmarks
        run: |
          cmake -B ./build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_CXX_FLAGS=-g \
                -DAREG_COMPILER_FAMILY=gnu \
                -DAREG_LIB_TYPE=static \
                -DAREG_BENCHMARKS=ON \
                -DAREG_TESTS=OFF \
                -DAREG_EXAMPLES=OFF \
                -DAREG_INSTALL=OFF \
                -DAREG_BIN_DIR=${{github.workspace}}/build/bin \
                -DCODSPEED_MODE=simulation
          cmake --build ./build --target areg-benchmarks -j $(nproc)

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: ./build/bin/areg-benchmarks.elf
